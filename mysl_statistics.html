  rowDel:el=>{
    const g=LIVE.g,i=g.events.findIndex(e=>e.id===el.dataset.id);if(i<0)return;
    const e=g.events.splice(i,1)[0];LIVE.redo.push({e,idx:i});toast('Removed #'+g.rosters[e.team][e.pi].number+' ('+SH_LB[el.dataset.k]+')','info');persist();drawLive();
  },
  npCycle:el=>{
    const g=LIVE.g,e=g.events.find(x=>x.id===el.dataset.id);if(!e)return;
    const order=['ft','fg2','fg3'],nxt=order[(order.indexOf(e.type)+1)%3];e.type=nxt;
    toast('Changed to '+(nxt==='ft'?'1':nxt==='fg2'?'2':'3')+' PT','info');persist();drawLive();
  }
});

/* ---------- 10. Router & event delegation ---------- */
const HK={team:null,buf:'',timer:null};
function hkFlush(){
  clearTimeout(HK.timer);const buf=HK.buf,team=HK.team;HK.buf='';HK.team=null;if(!buf||!LIVE.g)return;
  const r=LIVE.g.rosters[team];
  let idx=r.findIndex(x=>String(x.number)===buf);if(idx<0)idx=r.findIndex(x=>+x.number===+buf);
  if(idx<0)return toast(`No #${buf} on ${gTeam(LIVE.g,team).abbr}`,'bad');
  LIVE.sel={team,pi:idx};toast(`Selected #${r[idx].number} ${r[idx].name} (${gTeam(LIVE.g,team).abbr})`,'info');drawLive();
}
function hkNum(team,d){
  clearTimeout(HK.timer);if(HK.team!==team)HK.buf='';HK.team=team;HK.buf+=d;
  const r=LIVE.g.rosters[team],m=r.filter(x=>String(x.number).startsWith(HK.buf));
  if(m.length===1)return hkFlush();
  toast(`${gTeam(LIVE.g,team).abbr} #${HK.buf}…`,'info');HK.timer=setTimeout(hkFlush,850);
}
function hotkeysHelp(){
  say('LIVE SCORING — KEYBOARD SHORTCUTS\n\n'
    +'PICK PLAYER BY JERSEY NUMBER\n'
    +'  H + digits     Home player  (e.g. H 2 3  selects #23)\n'
    +'  V + digits     Away / visitor player  (e.g. V 7)\n'
    +'  ↑ / ↓          Previous / next player on that team\n\n'
    +'SCORE & STATS (for the selected player)\n'
    +'  1 / 2 / 3      1PT (FT) / 2PT / 3PT MADE\n'
    +'  Shift + 1/2/3  1PT / 2PT / 3PT MISSED\n'
    +'  O / D          Offensive / Defensive rebound\n'
    +'  A / S / B      Assist / Steal / Block\n'
    +'  T              Turnover\n'
    +'  F / W          Personal foul / Foul drawn\n\n'
    +'GAME CONTROLS\n'
    +'  X              Sub selected player in / out\n'
    +'  U              Lineup / substitutions window\n'
    +'  Space          Start / pause game clock\n'
    +'  [ / ]          −1s / +1s on clock\n'
    +'  Z / Y          Undo / Redo  (also Ctrl+Z / Ctrl+Y)\n'
    +'  ?              Show this list');
}
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey){
    if(location.hash.startsWith('#/live/')&&!$('#modal').innerHTML){
      if(e.code==='KeyZ'){e.preventDefault();A.undo()}
      if(e.code==='KeyY'){e.preventDefault();A.redo()}
    }
    return;
  }
  const t=e.target;if(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable)return;
  if($('#modal').innerHTML){if(e.key==='Escape')closeModal();return}
  if($('.dlgopen'))return;
  if(!location.hash.startsWith('#/live/')||!LIVE.g)return;
  const k=e.code,sh=e.shiftKey,eat=()=>e.preventDefault();
  if(LIVE.sf&&sfKey(e,eat))return;
  if(/^(Digit|Numpad)\d$/.test(k)){
    const d=k.slice(-1);
    if(HK.team&&!sh){eat();return hkNum(HK.team,d)}
    if(d==='1'||d==='2'||d==='3'){eat();const tp=d==='1'?'ft':d==='2'?'fg2':'fg3';return statFirstOn()?armStat(tp,!sh):record(tp,!sh)}
  }
  if(HK.team)hkFlush();
  if(k==='KeyH'||k==='KeyV'){eat();HK.team=k==='KeyH'?'home':'away';HK.buf='';toast(`Type ${gTeam(LIVE.g,HK.team).abbr} jersey #…`,'info');return}
  const one={KeyO:['oreb'],KeyD:['dreb'],KeyA:['ast'],KeyS:['stl'],KeyB:['blk'],KeyT:['tov'],KeyF:['pf'],KeyW:['fd']}[k];
  if(one){eat();return statFirstOn()?armStat(one[0],false):record(one[0],false)}
  if(k==='Space'){eat();A.clockToggle()}
  else if(k==='BracketLeft'){eat();A.clockAdj({dataset:{d:'-1'}})}
  else if(k==='BracketRight'){eat();A.clockAdj({dataset:{d:'1'}})}
  else if(k==='KeyZ'){eat();A.undo()}
  else if(k==='KeyY'){eat();A.redo()}
  else if(k==='KeyU'){eat();openLineup(LIVE.sel?LIVE.sel.team:'home')}
  else if(k==='KeyX'){eat();if(!LIVE.sel)return toast('Select a player first','bad');A.toggleCourt({dataset:{team:LIVE.sel.team,pi:LIVE.sel.pi}})}
  else if(k==='ArrowUp'||k==='ArrowDown'){
    eat();const side=LIVE.sel?LIVE.sel.team:'home',r=LIVE.g.rosters[side];if(!r.length)return;
    const cur=LIVE.sel?LIVE.sel.pi:-1,pi=(cur+(k==='ArrowDown'?1:-1)+r.length)%r.length;LIVE.sel={team:side,pi};drawLive();
  }
  else if(e.key==='?'){eat();hotkeysHelp()}
});

function setCur(id){CUR=id;LS.setItem('cs_season',id);const s=$('#curSeason');if(s)s.value=id}
function refreshSeasonSel(){const s=$('#curSeason');if(s)s.innerHTML=seasonOpts(CUR,'All seasons')}
function render(){
  if(OBS.cfg.autoconnect&&OBS.state==='off'&&!OBS.tried){OBS.tried=1;obsConnect()}
  const h=(location.hash||'#/dashboard').replace(/^#\/?/,'');
  const[page,arg,arg2]=h.split('/');
  document.body.className=page==='overlay'?'overlay '+(arg2||'green'):'';
  if(page!=='live'&&LIVE.running)stopClock();
  if(page!=='live')LIVE.sf=null;
  refreshSeasonSel();
  const L=league(),br=$('#brand');if(br)br.innerHTML=(L.logo?`<img src="${L.logo}" alt="" style="height:26px;width:26px;object-fit:contain;border-radius:5px;margin-right:8px">` :'')+esc(L.name)+'_<b>Statistics</b>';
  printHead(page,arg);
  $$('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===page));
  const v=$('#view');
  if(page==='seasons')v.innerHTML=viewSeasons();
  else if(page==='divisions')v.innerHTML=viewDivisions();
  else if(page==='teams')v.innerHTML=viewTeams();
  else if(page==='players')v.innerHTML=viewPlayers();
  else if(page==='games')v.innerHTML=viewGames();
  else if(page==='standings')v.innerHTML=viewStandings();
  else if(page==='awards')v.innerHTML=viewAwards();
  else if(page==='history')v.innerHTML=viewHistory();
  else if(page==='live'){v.innerHTML=viewLive(arg);updateClockDom();sbLayout()}
  else if(page==='box')v.innerHTML=viewBox(arg);
  else if(page==='obs')v.innerHTML=viewObs();
  else if(page==='overlay'){v.innerHTML=viewOverlay(arg);try{BC&&BC.postMessage({hello:1})}catch{}}
  else if(page==='backup')viewBackup().then(t=>v.innerHTML=t);
  else v.innerHTML=viewDashboard();
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const fn=A[el.dataset.act];if(!fn)return;
  e.stopPropagation();
  Promise.resolve(fn(el)).catch(err=>{console.error(err);toast('Error: '+err.message,'bad')});
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.matches('[data-cur]')){setCur(t.value);render()}
  if(t.matches('[data-hf]')){
    const f=FS[t.dataset.hf];f[t.dataset.k]=t.value;
    if(t.dataset.k==='season')f.division='';
    render();
  }
  if(t.matches('[data-dep=season]')){const f=t.form;fillDiv(f);fillTeams(f)}
  if(t.matches('[data-dep=division]'))fillTeams(t.form);
  if(t.matches('.ent-season'))t.closest('.ent').querySelector('.ent-div').innerHTML=divOpts(t.value,'','Division…');
  if(t.matches('[data-logo]')&&t.files[0]){
    try{const u=await resizeLogo(t.files[0]);t.form.querySelector('[name=logo]').value=u;$('#logoPrev').innerHTML=logoImg(u,true)}
    catch(err){t.value='';toast('Image failed: '+err.message,'bad')}
  }
  if(t.matches('[data-restore]')&&t.files[0]){await restore(t.files[0]);t.value=''}
  if(t.matches('[data-obs]')){OBS.cfg[t.dataset.obs]=t.type==='checkbox'?t.checked:t.value;OBS.sent={};OBS.missing={};obsSaveCfg();if(t.dataset.obs==='prefix')render()}
  if(t.matches('[data-obsmap]')){OBS.cfg.map=OBS.cfg.map||{};OBS.cfg.map[t.dataset.obsmap]=t.value.trim();OBS.sent={};OBS.missing={};obsSaveCfg()}
  if(t.matches('[data-gs]')){GS.cfg[t.dataset.gs]=t.type==='checkbox'?t.checked:(t.dataset.gs.endsWith('Cell')?t.value.toUpperCase().trim():t.value.trim());GS.lastKey='';gsSave();if(t.dataset.gs!=='auto')render()}
  if(t.matches('[data-statfirst]')){try{LS.setItem('mysl_statfirst',t.checked?'1':'0')}catch{}LIVE.sf=null;drawLive()}
  if(t.matches('[data-np]')){LIVE.np=LIVE.np||{};LIVE.np[t.dataset.np]=+t.value}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='gsearch'){gsRun();return}
  if(t.id==='qe'){qePreview();return}
  if(t.id==='spin'){spAuto();return}
  if(t.matches('[data-hf][data-live]')){FS[t.dataset.hf][t.dataset.k]=t.value;const r=$('#results');if(r)r.innerHTML=t.dataset.hf==='players'?playersTable():histTable()}
  if(t.matches('[data-notes]')&&LIVE.g){LIVE.g.notes=t.value;clearTimeout(LIVE.nt);LIVE.nt=setTimeout(persist,400)}
  if(t.matches('[data-tnotes]')&&LIVE.g){LIVE.g.mercyNotes=LIVE.g.mercyNotes||{};LIVE.g.mercyNotes[t.dataset.tnotes]=t.value;clearTimeout(LIVE.nt);LIVE.nt=setTimeout(persist,400)}
});
window.addEventListener('hashchange',render);
window.addEventListener('beforeunload',e=>{if(LIVE.running){e.preventDefault();e.returnValue=''}});

/* ---------- 11. Boot & Firebase Cloud Initialization ---------- */
DB.onState=setSyncUi;
DB.onRemote=async()=>{await loadAll();render()};
DB.hold=()=>location.hash.startsWith('#/live/')&&LIVE.g&&LIVE.g.status==='Live';
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&DB.cloud.on)DB.sync()});
setSyncUi();

(async function boot(){
  await DB.open();
  await loadAll();
  render();

  /* Connect to Firebase Firestore & Auth for cross-device cloud sync */
  try{
    if(typeof __firebase_config!=='undefined'&&__firebase_config){
      const firebaseConfig=JSON.parse(__firebase_config);
      const appId=typeof __app_id!=='undefined'?__app_id:'default-app-id';
      const app=initializeApp(firebaseConfig);
      const auth=getAuth(app);
      const db=getFirestore(app);
      let cred;
      if(typeof __initial_auth_token!=='undefined'&&__initial_auth_token){
        cred=await signInWithCustomToken(auth,__initial_auth_token);
      }else{
        cred=await signInAnonymously(auth);
      }
      if(cred&&cred.user){
        await DB.attachFirebase(db,auth,cred.user,appId);
        await loadAll();
        render();
      }
    }else{
      setSyncUi();
    }
  }catch(err){
    console.warn('Firebase cloud setup fallback to local:',err);
    setSyncUi();
  }
})();
</script>
