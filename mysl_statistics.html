<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MYSL Statistics</title>
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}
img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
:root{--navy:#0b1f3a;--navy2:#13305a;--orange:#ff7a1a;--bg:#eef1f6;--card:#fff;--line:#d5dbe6;--txt:#17202e;--mut:#6a7689;--ok:#17a34a;--bad:#dc2626;--warn:#d97706}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt)}
header.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:30}
.brand{font-weight:900;letter-spacing:.08em;font-size:18px;padding:12px 0;display:flex;align-items:center}.brand b{color:var(--orange)}
nav{display:flex;gap:2px;flex:1;flex-wrap:wrap}
nav a{color:#c9d6ea;text-decoration:none;padding:14px 8px;font-weight:600;font-size:13px;border-bottom:3px solid transparent}
nav a:hover{color:#fff}nav a.on{color:#fff;border-color:var(--orange)}
.seasonsel{display:flex;gap:6px;align-items:center;font-size:12px;color:#c9d6ea}
.seasonsel select{background:var(--navy2);color:#fff;border:1px solid #2c4a7a;border-radius:6px;padding:5px 8px}
main{padding:18px;max-width:1500px;margin:0 auto}
h1{font-size:22px;margin:0 0 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1 .sp{flex:1}
h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}.stat b{display:block;font-size:28px;color:var(--navy)}.stat span{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.btn{background:#fff;border:1px solid var(--line);border-radius:7px;padding:7px 12px;font:inherit;font-weight:600;cursor:pointer;color:var(--txt);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.btn:hover{background:#f3f6fb}.btn.pri{background:var(--orange);border-color:var(--orange);color:#fff}.btn.pri:hover{background:#e86a0e}
.btn.dark{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.danger{color:var(--bad);border-color:#f0b8b8}.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th.sort{cursor:pointer;user-select:none}th.sort:hover{color:var(--navy)}
th{background:#f4f6fb;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:#fafbfe}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.tw table{margin:0}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700}
.b-Scheduled{background:#e5e9f2;color:#44526b}.b-Live{background:#fde8d4;color:#c2570c}.b-Final{background:#d9f4e2;color:#12823a}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.filters label,.fld{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--txt)}
input[type=file]{padding:4px}
.mback{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto}
.mbox{background:#fff;border-radius:12px;padding:18px;width:100%;max-width:520px}.mbox.wide{max-width:760px}
.mbody{display:grid;gap:12px;margin:12px 0}.mfoot{display:flex;justify-content:flex-end;gap:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ent{display:flex;gap:6px;margin-bottom:6px}.ent select{flex:1}
.logo{width:34px;height:34px;border-radius:6px;object-fit:contain;background:#eef1f6;border:1px solid var(--line);vertical-align:middle}
.logo.big{width:54px;height:54px}
.chip{display:inline-block;background:#e8eef9;border-radius:6px;padding:1px 7px;margin:1px 3px 1px 0;font-size:12px}
.empty{padding:26px;text-align:center;color:var(--mut)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:99;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{padding:9px 16px;border-radius:8px;color:#fff;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.25);animation:tin .15s}
.toast.ok{background:var(--ok)}.toast.bad{background:var(--bad)}.toast.info{background:var(--navy)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.warnbar{background:#fff4e0;border:1px solid #f3cf8c;color:#8a5200;padding:9px 12px;border-radius:8px;margin-bottom:14px}
/* LIVE */
.sb{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;background:var(--navy);color:#fff;border-radius:12px;padding:14px;margin-bottom:12px;align-items:center}
.sbt{display:flex;align-items:center;gap:14px}.sbt.away{flex-direction:row-reverse;text-align:right}
.sbt .nm{font-size:20px;font-weight:800}.sbt .meta{font-size:12px;color:#b8c8e2;margin-top:3px}
.sbt .meta b{color:#fff}.bonus{background:var(--orange);color:#fff;border-radius:4px;padding:0 5px;font-size:11px;font-weight:800;margin-left:4px}
.score{font-size:60px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;color:#ffd24a}
.sbm{text-align:center}.clock{font-size:52px;font-weight:900;font-variant-numeric:tabular-nums;background:#000;border-radius:8px;padding:2px 16px;cursor:pointer;color:#ff5a3c;min-width:190px}
.clock.run{color:#4ade80}
.ctl{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.ctl .btn{padding:5px 10px}
.per{display:flex;gap:4px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.per button{background:#1d3a66;color:#cfe0fb;border:0;border-radius:6px;padding:4px 10px;font-weight:700;cursor:pointer}.per button.on{background:var(--orange);color:#fff}
.livegrid{display:grid;grid-template-columns:1fr 330px 1fr;gap:12px;align-items:start}
.sect{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:800;margin:8px 2px 4px;display:flex;justify-content:space-between;align-items:center}
.pl{display:grid;grid-template-columns:44px 1fr auto auto auto auto auto 34px;gap:8px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:9px;padding:7px 8px;margin-bottom:5px;cursor:pointer;user-select:none}
.pl:hover{border-color:#9db5dd}.pl.sel{border-color:var(--orange);background:#fff4ea;box-shadow:0 0 0 2px rgba(255,122,26,.25)}
.pl.fouled{background:#fee2e2;border-color:#dc2626}.pl.fouled .nm,.pl.fouled .num{color:#b91c1c}.pl.sel.fouled{border-color:#dc2626;box-shadow:0 0 0 2px rgba(220,38,38,.3)}
.fo{background:#dc2626;color:#fff;border-radius:4px;padding:0 5px;font-size:10px;font-weight:800;margin-left:6px;white-space:nowrap}
.pl .num{font-weight:900;font-size:16px;color:var(--navy)}.pl .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .mini{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;text-align:right;min-width:36px}.mini.hot{color:var(--bad);font-weight:800}
.swap{border:1px solid var(--line);background:#f4f6fb;border-radius:6px;cursor:pointer;font-size:14px;padding:3px}
.flash-ok{animation:fok .9s}.flash-miss{animation:fmiss .9s}
@keyframes fok{0%,40%{background:#7be7a0;border-color:var(--ok)}}
@keyframes fmiss{0%,40%{background:#fca5a5;border-color:var(--bad)}}
.pad{position:sticky;top:var(--sbb,60px)}
.sb.pin{position:sticky;top:var(--hh,52px);z-index:15;box-shadow:0 6px 16px rgba(0,0,0,.28)}
.sb.compact{padding:6px 14px;gap:8px}.sb.compact .score{font-size:36px}.sb.compact .clock{font-size:30px;padding:0 10px;min-width:120px}.sb.compact .sbt .nm{font-size:15px}.sb.compact .meta,.sb.compact .per{display:none}.sb.compact .ctl{margin-top:4px}.sb.compact .logo.big{width:30px;height:30px}
.selinfo{background:var(--navy);color:#fff;border-radius:9px;padding:9px 12px;font-weight:800;margin-bottom:8px;min-height:40px}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.pg button{padding:12px 6px;border-radius:8px;border:2px solid var(--line);background:#fff;font-weight:800;cursor:pointer;font-size:13px}
.pg button.made{background:#dcf7e5;border-color:#86d9a3;color:#0f6b30}.pg button.miss{background:#fde4e4;border-color:#f0a3a3;color:#a11d1d}
.pg button:active{transform:scale(.97)}
.pbp{max-height:320px;overflow:auto;font-size:13px}
.pbp div{display:flex;gap:8px;padding:4px 6px;border-bottom:1px solid #eef1f6;align-items:center}
.pbp .t{width:74px;color:var(--mut);font-variant-numeric:tabular-nums;flex:none}.pbp .sc{width:56px;font-weight:700;flex:none;font-variant-numeric:tabular-nums}.pbp .d{flex:1}
/* BOX */
.boxhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.qt td,.qt th{text-align:center}.qt td:first-child,.qt th:first-child{text-align:left}
.box td,.box th{padding:5px 6px;font-size:12.5px;text-align:center;white-space:nowrap}.box td.l,.box th.l{text-align:left}
.box tr.tot td{font-weight:800;background:#f4f6fb;border-top:2px solid var(--navy)}
.box .dnp{color:var(--mut);font-style:italic}
.box tr.potg td{background:#fff3c4}
.box tr.fo td{background:#fee2e2!important;color:#b91c1c;font-weight:700}
.potg-card{background:linear-gradient(90deg,#fff6d6,#fff);border:2px solid #f2c230;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.potg-card .star{font-size:34px}.potg-card .big{font-size:20px;font-weight:900;color:var(--navy)}
.potg-card .lbl{font-size:11px;font-weight:800;letter-spacing:.08em;color:#9a6b00}
.potg-mini{background:#fff6d6;border:1px solid #f2c230;border-radius:9px;padding:7px 10px;margin-top:8px;font-size:12px}
.tn{font-size:16px;font-weight:800;margin:14px 0 6px;display:flex;align-items:center;gap:8px}
.gs{position:relative}
.gs input{background:#13305a;color:#fff;border:1px solid #2c4a7a;border-radius:8px;padding:7px 10px;width:270px;font-size:13px}.gs input::placeholder{color:#9db5dd}
#gsres{position:absolute;right:0;top:calc(100% + 4px);width:min(600px,92vw);background:#fff;color:var(--txt);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 34px rgba(0,0,0,.3);max-height:70vh;overflow:auto;z-index:70;display:none}
.gsn{padding:8px 12px;color:var(--mut);font-size:12px}.gsr{padding:9px 12px;border-top:1px solid #eef1f6;cursor:pointer}.gsr:hover{background:#fff4ea}
.mercy{background:#dc2626;color:#fff;font-weight:800;padding:10px 14px;border-radius:9px;margin-bottom:10px;animation:mpulse 1.4s infinite}
.mercy.soft{background:#fde2e2;color:#991b1b;animation:none;font-weight:600}
@keyframes mpulse{50%{background:#991b1b}}
.awgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:10px}
.aw{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}.aw.mvp{background:linear-gradient(90deg,#fff6d6,#fff);border:2px solid #f2c230}
.awtag{font-size:11px;font-weight:800;letter-spacing:.07em;color:#9a6b00}.awn{font-size:16px;font-weight:800;color:var(--navy);margin:3px 0}.awt{color:var(--mut);font-size:12px}.awl{margin-top:6px;font-size:13px}.awm{margin-top:4px;font-size:12px;font-weight:700;color:var(--navy)}
tr.unq td{color:#9aa4b5}
#printhead{display:none}
body.overlay{background:#00b140;overflow:hidden}body.overlay.dark{background:#111}body.overlay.transparent{background:transparent}
body.overlay header.top,body.overlay #printhead{display:none!important}body.overlay main{padding:0;max-width:none}
.ovbox{padding:1.2vw}.ov{display:grid;grid-template-columns:1fr auto 1fr;background:#0b1f3a;color:#fff;border-radius:1.2vw 1.2vw 0 0;overflow:hidden;font-size:3vw;font-family:system-ui,sans-serif}
.ovteam{display:flex;align-items:center;gap:1.2vw;padding:.8vw 2vw}.ovteam.home{flex-direction:row-reverse}
.ovlogo img{height:5.5vw;width:5.5vw;object-fit:contain}.ovabbr{font-weight:800;letter-spacing:.05em}
.ovscore{font-size:1.7em;font-weight:900;color:#ffd24a;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}.ovteam.away .ovscore{margin-left:auto}.ovteam.home .ovscore{margin-right:auto}
.ovmid{background:#000;padding:.6vw 2.2vw;text-align:center;display:flex;flex-direction:column;justify-content:center}
.ovclock{font-size:1.5em;font-weight:900;color:#ff5a3c;font-variant-numeric:tabular-nums;line-height:1.1}.ovclock.run{color:#4ade80}.ovper{font-size:.7em;color:#cfe0fb;font-weight:700}
.ovsub{display:grid;grid-template-columns:1fr auto 1fr;font-size:1.6vw;background:#13305a;color:#cfe0fb;padding:.4vw 2vw;border-radius:0 0 1.2vw 1.2vw;font-weight:700}.ovsub span:last-child{text-align:right}.ovbonus{background:#ff7a1a;color:#fff;border-radius:.4vw;padding:0 .6vw;margin-left:.6vw}
.lu-top{margin-bottom:10px}.lu-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lu-p{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:12px;margin-bottom:6px;border:2px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-size:15px;cursor:pointer}
.lu-p small{margin-left:auto;color:var(--mut);font-size:11px;white-space:nowrap}.lu-p.on{background:#dcf7e5;border-color:#86d9a3}.lu-p.armed{background:#fff4ea;border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,122,26,.3)}.lu-p.fo5{color:#b91c1c}
.lu-tag{font-size:10px;font-weight:800;border-radius:4px;padding:0 5px;color:#fff}.lu-tag.in{background:var(--ok)}.lu-tag.out{background:var(--bad)}
.lu-sum{margin-top:10px;padding:8px 10px;background:#f4f6fb;border-radius:8px;font-size:13px}
#sfwrap:empty{display:none}.sfbar{background:var(--orange);color:#fff;font-weight:800;padding:9px 11px;border-radius:9px;margin-bottom:8px;font-size:14px}.sfbar small{font-weight:600;opacity:.9}
#qe:focus{outline:3px solid rgba(255,122,26,.45);border-color:var(--orange)}
@media(max-width:1150px){.livegrid{grid-template-columns:1fr 1fr}.pad{grid-column:1/3;grid-row:1;position:static}.sb{grid-template-columns:1fr}.score{font-size:46px}}
@media print{
 @page{size:landscape;margin:10mm}
 body{background:#fff}header.top,.noprint,#toast,.btn{display:none!important}
 main{padding:0;max-width:none}.card{border:0;padding:0}.tw{border:0;overflow:visible}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .box,.qt{border-collapse:collapse;border:2px solid #000}
 .box th,.box td,.qt th,.qt td{border:1px solid #000!important;color:#000}
 .box th,.qt th{background:#e5e5e5!important}
 .box tr.tot td{border-top:2px solid #000!important}
 .box tr.fo td{color:#b91c1c}
 .potg-card,.potg-mini{border:1px solid #000!important}
 #printhead{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:12px}
 #printhead img{height:68px;max-width:130px;object-fit:contain}.ph-c{text-align:center;flex:1}.ph-c b{font-size:20px}
 .aw{border:1px solid #000!important;break-inside:avoid}.mercytbl,.flow{border-collapse:collapse}.mercy{animation:none;color:#000!important;background:#fff!important;border:2px solid #000}
}
/* STAT SHEET (jersey-number tally columns) */
.shgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media(max-width:1000px){.shgrid{grid-template-columns:1fr}}
.shcard{min-width:0}
.tos{display:inline-flex;gap:4px;vertical-align:middle;align-items:center}.tob{display:inline-block;width:18px;height:11px;border:2px solid currentColor;border-radius:2px;box-sizing:border-box}.tob.used{background:#dc2626;border-color:#dc2626}
.shgrid4{display:grid;grid-template-columns:340px minmax(0,1fr) minmax(0,1fr) 340px;gap:12px;align-items:start}
.shside{min-width:0;position:sticky;top:var(--sbb,60px);max-height:calc(100vh - var(--sbb,60px) - 12px);overflow:auto;padding:10px}
.shside .tn{font-size:14px;flex-wrap:wrap}
.shside .ps{font-size:12px}.shside .ps th,.shside .ps td{padding:3px 2px}
.shside .ps td.l{max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:1500px){.shgrid4{grid-template-columns:1fr 1fr}.shgrid4>.sh-hl{order:1}.shgrid4>.sh-al{order:2}.shgrid4>.sh-hs{order:3}.shgrid4>.sh-as{order:4}.shside{position:static;max-height:none}}
@media(max-width:1000px){.shgrid4{grid-template-columns:1fr}.shgrid4>*{order:initial!important}}
.qpanel{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;margin:0 0 8px}
.qc{display:inline-block;background:#e8eef9;border-radius:6px;padding:2px 8px;font-weight:700;color:var(--navy)}.qc.bon{background:#dc2626;color:#fff}
.slog{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.sl{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
.sl th,.sl td{padding:2px 3px;text-align:center;border-bottom:1px solid #eef1f6;white-space:nowrap}
.sl thead th{position:sticky;top:0;background:#13305a;color:#fff;font-size:11px;z-index:3;height:24px}
.sl thead th.fq{background:#ff7a1a}.sl thead th.curq{outline:2px solid #fff;outline-offset:-3px}
.sl tr.inr td{position:sticky;top:24px;background:#fff8d6;z-index:2;border-bottom:2px solid #f2c230;padding:4px 3px}
.sl .grp{border-left:2px solid #b8c8e2}.sl td.curq{background:#fff4ea}
.sl .rs{font-weight:900;color:var(--navy);font-size:14px;min-width:30px}
.sl select{font:inherit;font-weight:800;padding:4px 2px;border:2px solid var(--line);border-radius:8px;background:#fff;font-size:15px}
.np{display:inline-block;min-width:24px;border-radius:6px;font-weight:900;color:#fff;cursor:pointer;padding:1px 0}.np1{background:#7bc79a}.np2{background:#17a34a}.np3{background:#2563eb}
.ji{width:100%;min-width:34px;text-align:center;font:inherit;font-weight:800;font-size:16px;padding:6px 2px;border:2px solid var(--line);border-radius:8px;background:#fff;scroll-margin-top:200px;scroll-margin-bottom:80px}
.ji:focus{outline:3px solid rgba(255,122,26,.45);border-color:var(--orange);background:#fff4ea}
.jc{display:inline-block;min-width:26px;background:#13305a;color:#fff;border-radius:6px;padding:1px 5px;font-weight:800;font-size:13px;cursor:pointer;font-variant-numeric:tabular-nums}.jc:hover{background:#dc2626}
.ps{width:100%;border-collapse:collapse;font-size:13px}.ps th{background:#f4f6fb;font-size:11px;color:var(--mut);text-transform:uppercase;padding:4px 3px;text-align:center;white-space:nowrap}.ps td{padding:3px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.ps td.l{text-align:left;font-weight:700}.ps tr.on td{background:#eaf7ee}.ps tr.gfo td{background:#fee2e2}.ps tr.gtot td{font-weight:800;background:#f4f6fb;border-top:2px solid var(--navy)}
.ps .tt{font-weight:900;color:var(--navy)}
.ghint{background:#eef3fb;border:1px solid #b8c8e2;color:#13305a;padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:13px}
.dmsg{white-space:pre-line;font-size:15px;line-height:1.5}
.syncbtn{background:var(--navy2);color:#cfe0fb;border-color:#2c4a7a;white-space:nowrap}.syncbtn:hover{background:#1d3f75}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc, onSnapshot, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

/* ==========================================================================
   MYSL_Statistics — Cloud-Synced Single-File League & Live Scoring App
   1. Safe storage + in-page dialogs
   2. Hybrid DB: IndexedDB local cache + Firebase Firestore real-time cloud sync
   3. State & helpers
   4. Stat engine (compute, efficiency, POTG, mercy rule, game flow)
   5. Management pages (Dashboard, Seasons, Divisions, Teams, Players)
   6. Games, Standings, Season Awards, History
   7. Live Statistics (Stat Sheet mode & Hotkey/Quick-Entry mode, Lineups)
   8. Box Score & Print Header
   9. OBS WebSocket v5, Pop-out Overlay, Google Sheets Sync
   10. Cloud Sync & Backup / Restore
   ========================================================================== */

/* ---------- 1. Safe browser storage wrapper ---------- */
const LS=(()=>{
  try{
    const t='__mysl_t';
    window.localStorage.setItem(t,'1');
    window.localStorage.removeItem(t);
    return window.localStorage;
  }catch{
    const m={};
    return{getItem:k=>(k in m?m[k]:null),setItem:(k,v)=>{m[k]=String(v)},removeItem:k=>{delete m[k]}};
  }
})();

/* In-page dialogs (never uses native alert/confirm/prompt) */
function dlg(msg,btns,o){
  o=o||{};
  return new Promise(res=>{
    const el=document.createElement('div');el.className='mback dlgopen';el.style.zIndex=90;
    const f=document.createElement('form');f.className='mbox';
    const m=document.createElement('div');m.className='dmsg';m.textContent=msg;f.appendChild(m);
    let inp=null;
    if(o.input!=null){
      inp=document.createElement('input');
      inp.style.cssText='width:100%;margin-top:10px';
      inp.value=o.input;
      if(o.placeholder)inp.placeholder=o.placeholder;
      f.appendChild(inp);
    }
    const foot=document.createElement('div');foot.className='mfoot';foot.style.marginTop='14px';
    let done=false;
    const onKey=e=>{if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();fin(-1)}};
    const fin=i=>{if(done)return;done=true;document.removeEventListener('keydown',onKey,true);el.remove();res({i,val:inp?inp.value:null})};
    btns.forEach((b,i)=>{
      const last=i===btns.length-1,bt=document.createElement('button');
      bt.type=last?'submit':'button';
      bt.className='btn'+(last?' pri':'');
      bt.textContent=b;
      if(!last)bt.onclick=()=>fin(i);
      foot.appendChild(bt);
    });
    f.onsubmit=e=>{e.preventDefault();fin(btns.length-1)};
    f.appendChild(foot);el.appendChild(f);document.body.appendChild(el);
    document.addEventListener('keydown',onKey,true);
    if(inp){inp.focus();inp.select()}else foot.lastChild.focus();
  });
}
const ask=(m,ok)=>dlg(m,['Cancel',ok||'OK']).then(r=>r.i===1);
const say=m=>dlg(m,['OK']).then(()=>{});
const askText=(m,def,ph)=>dlg(m,['Cancel','OK'],{input:def,placeholder:ph}).then(r=>r.i===1?r.val:null);

/* ---------- 2. Hybrid DB: Local IndexedDB + Firebase Firestore Cloud ---------- */
const DB=(()=>{
  const NAME='mysl_stats_v1',VER=2,STORES=['seasons','divisions','teams','players','games','settings'];
  let idb=null;
  const MIR={};STORES.forEach(s=>MIR[s]=new Map());
  const sanitizeKey=k=>String(k).replace(/[^A-Za-z0-9_\-.~:@+]/g,'_');
  const bucketOf=(st,o)=>sanitizeKey(st==='players'?(o.teamId||'none'):o.id);

  /* Local IndexedDB cache */
  const openLocal=()=>new Promise(res=>{
    let done=false;const fin=()=>{if(!done){done=true;res()}};
    try{
      const r=indexedDB.open(NAME,VER);
      r.onblocked=()=>{
        const v=document.getElementById('view');
        if(v)v.innerHTML='<div class="warnbar">⚠ Local database is blocked by another open tab of this app. Close extra tabs and reload.</div>';
      };
      r.onupgradeneeded=()=>{
        const d=r.result;
        STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})});
      };
      r.onsuccess=async()=>{
        idb=r.result;
        idb.onversionchange=()=>idb.close();
        try{
          for(const s of STORES){
            const rows=await new Promise((a,b)=>{
              const q=idb.transaction(s).objectStore(s).getAll();
              q.onsuccess=()=>a(q.result);
              q.onerror=()=>b(q.error);
            });
            rows.forEach(o=>MIR[s].set(o.id,o));
          }
        }catch(e){console.warn('Local read warning:',e)}
        fin();
      };
      r.onerror=()=>{idb=null;fin()};
    }catch(e){idb=null;fin()}
  });

  const lw=(store,fn)=>new Promise(res=>{
    if(!idb)return res();
    try{
      const t=idb.transaction(store,'readwrite');
      fn(t.objectStore(store));
      t.oncomplete=()=>res();
      t.onerror=t.onabort=()=>{console.warn('Local save warning:',t.error);res()};
    }catch(e){console.warn(e);res()}
  });

  /* Firebase Cloud State */
  const CL={
    db:null,auth:null,user:null,appId:'default-app-id',
    workspace:LS.getItem('mysl_workspace')||'main-league',
    state:'off',msg:'',last:'',chain:Promise.resolve(),timer:null,retry:null,unsubs:[]
  };
  const DIRTY=(()=>{try{return JSON.parse(LS.getItem('mysl_dirty')||'{}')}catch{return{}}})();
  const persistDirty=()=>{try{LS.setItem('mysl_dirty',JSON.stringify(DIRTY))}catch{}};
  const ui=()=>{if(api.onState)api.onState()};
  const nowStr=()=>new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  const mark=(s,key)=>{
    const k=s+'|'+key;
    DIRTY[k]=(DIRTY[k]||0)+1;
    persistDirty();
    schedule();
    ui();
  };

  /* Strict Firestore path builder: /artifacts/{appId}/public/data/{ws}_{store} */
  const wsPrefix=()=>sanitizeKey(CL.workspace||'main-league');
  const colRef=name=>collection(CL.db,'artifacts',CL.appId,'public','data',`${wsPrefix()}_${name}`);
  const docRef=(name,id)=>doc(CL.db,'artifacts',CL.appId,'public','data',`${wsPrefix()}_${name}`,sanitizeKey(id));

  /* Chunking for large documents (e.g., teams with logos or long game logs) */
  const CH=180000;
  const enc=obj=>{
    const j=JSON.stringify(obj),p=[];
    for(let i=0;i<j.length;i+=CH)p.push(j.slice(i,i+CH));
    return p.length?p:['null'];
  };

  async function pushKey(s,key){
    if(!CL.db||!CL.user)return;
    const recs=[...MIR[s].values()].filter(o=>bucketOf(s,o)===key);
    const ref=docRef(s,key);
    if(!recs.length){
      await deleteDoc(ref);
      return;
    }
    const parts=enc(s==='players'?recs:recs[0]);
    for(let i=1;i<parts.length;i++){
      await setDoc(docRef(s+'_x',`${key}~${i}`),{d:parts[i],u:Date.now()});
    }
    await setDoc(ref,{n:parts.length,d:parts[0],u:Date.now()});
  }

  async function flushTask(){
    if(!CL.db||!CL.user)return;
    for(let guard=0;guard<60;guard++){
      const keys=Object.keys(DIRTY);
      if(!keys.length)return;
      for(const k of keys){
        const v=DIRTY[k],i=k.indexOf('|');
        await pushKey(k.slice(0,i),k.slice(i+1));
        if(DIRTY[k]===v){delete DIRTY[k];persistDirty()}
      }
    }
  }

  async function pull(){
    if(!CL.db||!CL.user)return null;
    const out={};
    for(const s of STORES){
      const snap=await getDocs(colRef(s));
      const recs=[];
      let extra=null;
      for(const d of snap.docs){
        const x=d.data();
        if(!x||typeof x.d!=='string')continue;
        let str=x.d;
        if(x.n>1){
          if(!extra){
            extra={};
            const xSnap=await getDocs(colRef(s+'_x'));
            xSnap.docs.forEach(c=>{extra[c.id]=(c.data()||{}).d});
          }
          for(let i=1;i<x.n;i++){
            const part=extra[`${d.id}~${i}`];
            if(typeof part!=='string')throw new Error('Cloud record is still uploading — try syncing again in a moment.');
            str+=part;
          }
        }
        const v=JSON.parse(str);
        if(s==='players')recs.push(...v);
        else if(v)recs.push(v);
      }
      out[s]=recs;
    }
    return out;
  }

  async function pushAllTask(){
    if(!CL.db||!CL.user)return;
    for(const s of STORES){
      const keys=new Set([...MIR[s].values()].map(o=>bucketOf(s,o)));
      const snap=await getDocs(colRef(s));
      for(const d of snap.docs){
        if(!keys.has(d.id))await deleteDoc(docRef(s,d.id));
      }
      keys.forEach(k=>{DIRTY[s+'|'+k]=(DIRTY[s+'|'+k]||0)+1});
    }
    persistDirty();
    await flushTask();
  }

  async function applyRemote(remote){
    for(const s of STORES){
      MIR[s].clear();
      remote[s].forEach(o=>MIR[s].set(o.id,o));
      await lw(s,st=>st.clear());
      await lw(s,st=>remote[s].forEach(o=>st.put(o)));
    }
    if(api.onRemote)await api.onRemote();
  }

  async function syncTask(){
    if(!CL.db||!CL.user)return;
    CL.state='syncing';ui();
    await flushTask();
    const remote=await pull();
    if(!remote)return;
    const sig=l=>JSON.stringify([...l].sort((a,b)=>String(a.id)<String(b.id)?-1:1));
    const empty=STORES.every(s=>!remote[s].length);
    const localHas=STORES.some(s=>MIR[s].size);
    const differs=STORES.some(s=>sig(remote[s])!==sig(MIR[s].values()));
    const initKey='mysl_cloud_init_'+wsPrefix();
    const init=LS.getItem(initKey)==='1';

    if(!differs){}
    else if(empty){
      await pushAllTask();
    }else if(!localHas){
      await applyRemote(remote);
    }else if(!init){
      const r=await dlg(
        `This device has local data, and League Space "${CL.workspace}" in the cloud also has data, and they differ.\n\nWhich version would you like to keep?`,
        ['Keep this device (overwrite cloud)','Keep cloud data (replace this device)']
      );
      if(r.i===0)await pushAllTask();
      else if(r.i===1)await applyRemote(remote);
      else{CL.state='paused';ui();return}
    }else if(Object.keys(DIRTY).length||(api.hold&&api.hold())){
      // Currently busy scoring a live game or flushing local changes; defer overwrite
    }else{
      await applyRemote(remote);
    }
    LS.setItem(initKey,'1');
    CL.state='ok';
    CL.last=nowStr();
    ui();
  }

  function startRealtimeListeners(){
    CL.unsubs.forEach(u=>{try{u()}catch{}});
    CL.unsubs=[];
    if(!CL.db||!CL.user)return;
    let debounce=null;
    STORES.forEach(s=>{
      const u=onSnapshot(colRef(s),()=>{
        if(Object.keys(DIRTY).length||(api.hold&&api.hold()))return;
        clearTimeout(debounce);
        debounce=setTimeout(()=>{api.sync()},600);
      },err=>{
        console.warn('Realtime listener warning:',s,err);
      });
      CL.unsubs.push(u);
    });
  }

  const fail=e=>{
    CL.state='err';
    CL.msg=(e&&e.message)||String(e);
    console.warn('Cloud sync error:',e);
    clearTimeout(CL.retry);
    CL.retry=setTimeout(()=>{if(CL.db&&CL.user)schedule(true)},15000);
    ui();
  };
  const enqueue=fn=>{CL.chain=CL.chain.then(()=>fn()).catch(fail);return CL.chain};
  function schedule(now){
    if(!CL.db||!CL.user)return;
    clearTimeout(CL.timer);
    CL.timer=setTimeout(()=>enqueue(async()=>{
      await flushTask();
      if(CL.state!=='paused'){CL.state='ok';CL.last=nowStr()}
      ui();
    }),now?0:500);
  }

  const api={
    open:async()=>{await openLocal()},
    STORES,
    isOpen:()=>true,
    all:async s=>[...MIR[s].values()],
    put:async(s,o)=>{MIR[s].set(o.id,o);mark(s,bucketOf(s,o));await lw(s,st=>st.put(o))},
    add:async(s,o)=>{if(MIR[s].has(o.id))throw new Error('That ID already exists');MIR[s].set(o.id,o);mark(s,bucketOf(s,o));await lw(s,st=>st.put(o))},
    del:async(s,id)=>{const o=MIR[s].get(id);MIR[s].delete(id);if(o)mark(s,bucketOf(s,o));await lw(s,st=>st.delete(id))},
    clear:async s=>{MIR[s].clear();await lw(s,st=>st.clear())},
    bulk:async(s,arr)=>{arr.forEach(o=>MIR[s].set(o.id,o));await lw(s,st=>arr.forEach(o=>st.put(o)))},
    attachFirebase:(db,auth,user,appId)=>{
      CL.db=db;CL.auth=auth;CL.user=user;CL.appId=appId||'default-app-id';
      CL.state='syncing';ui();
      startRealtimeListeners();
      return api.sync();
    },
    setWorkspace:async ws=>{
      const clean=ws.trim()||'main-league';
      CL.workspace=clean;
      LS.setItem('mysl_workspace',clean);
      if(CL.db&&CL.user){
        startRealtimeListeners();
        await api.sync();
      }
      ui();
    },
    sync:()=>CL.db&&CL.user?enqueue(syncTask):Promise.resolve(),
    pushAll:()=>CL.db&&CL.user?enqueue(async()=>{CL.state='syncing';ui();await pushAllTask();CL.state='ok';CL.last=nowStr();ui()}):Promise.resolve(),
    get cloud(){
      return{
        on:!!(CL.db&&CL.user),
        state:CL.state,
        msg:CL.msg,
        last:CL.last,
        workspace:CL.workspace,
        uid:CL.user?CL.user.uid:'',
        pending:Object.keys(DIRTY).length
      };
    },
    onState:null,
    onRemote:null,
    hold:null,
  };
  return api;
})();

/* ---------- 3. State & helpers ---------- */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const S={seasons:[],divisions:[],teams:[],players:[],games:[],settings:[]};
let CUR=LS.getItem('cs_season')||'';
const by=(st,id)=>S[st].find(x=>x.id===id);
async function loadAll(){
  for(const s of DB.STORES)S[s]=await DB.all(s);
  if(CUR&&!by('seasons',CUR))CUR='';
}
async function save(store,o){
  await DB.put(store,o);
  const a=S[store],i=a.findIndex(x=>x.id===o.id);
  i>=0?a[i]=o:a.push(o);
}
async function create(store,o){
  await DB.add(store,o);
  S[store].push(o);
}
async function remove(store,id){
  await DB.del(store,id);
  S[store]=S[store].filter(x=>x.id!==id);
}
const sName=id=>by('seasons',id)?.name||'—',dName=id=>by('divisions',id)?.name||'—';
const league=()=>by('settings','league')||{id:'league',name:'MYSL',logo:''};
const numCmp=(a,b)=>(parseInt(a,10)||0)-(parseInt(b,10)||0)||String(a).localeCompare(String(b));
const fmtDate=d=>{if(!d)return'—';const[y,m,dd]=d.split('-').map(Number);return new Date(y,m-1,dd).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})};
const fmtTime=t=>{if(!t)return'';const[h,m]=t.split(':').map(Number);return new Date(2000,0,1,h,m).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})};
const mmss=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const clockStr=s=>s<60?(Math.max(0,s)).toFixed(1).padStart(4,'0'):mmss(Math.ceil(s));
const pct=(m,a)=>a?Math.round(m/a*100)+'%':'—';
const pm=n=>n>0?'+'+n:String(n);
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function gameCode(g){const s=by('seasons',g.seasonId);const m=s&&s.name.match(/\d+/);return(m?'S'+m[0]:'G')+'-'+String(g.no||0).padStart(3,'0')}
function gTeam(g,side){const t=by('teams',g[side+'Id']);return{name:g[side+'Name']||t?.name||'?',abbr:g[side+'Abbr']||t?.abbr||'?',logo:t?.logo||''}}
async function download(name,text,type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:type||'text/plain'}));
  a.download=name;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
  return true;
}
const csvCell=v=>{v=String(v??'');return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const toCSV=rows=>rows.map(r=>r.map(csvCell).join(',')).join('\r\n');

/* ---------- 4. Stat engine: everything derived from the event log ---------- */
const periodLen=(g,p)=>p<=4?g.periodSec:g.otSec;
const mercyTh=g=>g.mercy==null?25:+g.mercy;
const mercyVal=fd=>{const v=fd.get('mercy');return v===''||v==null||!Number.isFinite(+v)?25:Math.max(0,Math.round(+v))};
const offset=(g,p)=>p<=4?(p-1)*g.periodSec:4*g.periodSec+(p-5)*g.otSec;
const nowT=g=>offset(g,g.period)+periodLen(g,g.period)-g.clock;
const periodLabel=p=>p<=4?'Q'+p:'OT'+(p-4);
const toAllowed=p=>p<=2?2:3;
const toLeft=(c,side,p)=>toAllowed(p)-c.toh[side][p<=2?0:1];
function toBoxes(c,side,p){
  const used=c.toh[side][p<=2?0:1],n=Math.max(toAllowed(p),used);
  return`<span class="tos" title="${p<=2?'1st half':'2nd half'}: ${used} of ${toAllowed(p)} timeouts used">`+Array.from({length:n},(_,i)=>`<i class="tob ${i<used?'used':''}"></i>`).join('')+'</span>';
}
const blank=()=>({min:0,sec:0,fg2m:0,fg2a:0,fg3m:0,fg3a:0,ftm:0,fta:0,oreb:0,dreb:0,ast:0,stl:0,blk:0,tov:0,pf:0,fd:0,pts:0,pm:0,on:false,since:0});
function compute(g,tNow){
  if(tNow==null)tNow=nowT(g);
  const ro=g.rosters||{home:[],away:[]};
  const R={home:ro.home.map(blank),away:ro.away.map(blank)};
  const q={home:{},away:{}},tf={home:{},away:{}},to={home:0,away:0},toh={home:[0,0],away:[0,0]};
  const run={home:0,away:0},fl={maxHome:0,maxAway:0,ties:0,changes:0,last:0,mercy:{home:null,away:null}};
  const opp=s=>s==='home'?'away':'home';
  const score=(side,pts,e)=>{
    run[side]+=pts;const d=run.home-run.away;
    if(d>fl.maxHome)fl.maxHome=d;
    if(-d>fl.maxAway)fl.maxAway=-d;
    if(d===0)fl.ties++;
    const th=mercyTh(g);
    if(th>0){
      if(d>=th&&!fl.mercy.home)fl.mercy.home={p:e.p,clk:e.clk,lead:d};
      if(-d>=th&&!fl.mercy.away)fl.mercy.away={p:e.p,clk:e.clk,lead:-d};
    }
    const ld=Math.sign(d);
    if(ld!==0){if(fl.last!==0&&ld!==fl.last)fl.changes++;fl.last=ld}
    q[side][e.p]=(q[side][e.p]||0)+pts;
    R[side].forEach(p=>{if(p.on)p.pm+=pts});
    R[opp(side)].forEach(p=>{if(p.on)p.pm-=pts});
  };
  for(const e of g.events){
    const side=e.team;
    if(e.type==='timeout'){to[side]++;toh[side][e.p<=2?0:1]++;continue}
    const P=(R[side]||[])[e.pi];if(!P)continue;
    switch(e.type){
      case'fg2':P.fg2a++;if(e.made){P.fg2m++;P.pts+=2;score(side,2,e)}break;
      case'fg3':P.fg3a++;if(e.made){P.fg3m++;P.pts+=3;score(side,3,e)}break;
      case'ft':P.fta++;if(e.made){P.ftm++;P.pts+=1;score(side,1,e)}break;
      case'a2':P.xa2=(P.xa2||0)+1;break;
      case'a3':P.xa3=(P.xa3||0)+1;break;
      case'af':P.xaf=(P.xaf||0)+1;break;
      case'oreb':case'dreb':case'ast':case'stl':case'blk':case'tov':case'fd':P[e.type]++;break;
      case'pf':{P.pf++;const k=Math.min(e.p,5);tf[side][k]=(tf[side][k]||0)+1;break}
      case'sub':
        if(e.in&&!P.on){P.on=true;P.since=e.t}
        else if(!e.in&&P.on){P.sec+=Math.max(0,e.t-P.since);P.on=false}
        break;
    }
  }
  for(const s of['home','away'])R[s].forEach(P=>{
    P.min=P.sec+(P.on?Math.max(0,tNow-P.since):0);
    P.fg2a=Math.max(P.fg2a,P.xa2||0);
    P.fg3a=Math.max(P.fg3a,P.xa3||0);
    P.fta=Math.max(P.fta,P.xaf||0);
  });
  const sum=o=>Object.values(o).reduce((a,b)=>a+b,0);
  return{R,q,tf,to,toh,flow:fl,score:{home:sum(q.home),away:sum(q.away)}};
}
function totals(arr){
  const t=blank();
  arr.forEach(P=>{for(const k of['min','fg2m','fg2a','fg3m','fg3a','ftm','fta','oreb','dreb','ast','stl','blk','tov','pf','fd','pts'])t[k]+=P[k]});
  return t;
}

/* Player of the Game: EFF = (PTS+REB+AST+STL+BLK) − missed FG − missed FT − TO */
const effOf=P=>P.pts+P.oreb+P.dreb+P.ast+P.stl+P.blk-(P.fg2a+P.fg3a-P.fg2m-P.fg3m)-(P.fta-P.ftm)-P.tov;
const statLine=P=>`${P.pts} PTS · ${P.oreb+P.dreb} REB · ${P.ast} AST · ${P.stl} STL · ${P.blk} BLK`;
function potgOf(g,c){
  if(!g.rosters)return null;c=c||compute(g);
  const mk=(team,pi)=>{const P=(c.R[team]||[])[pi],r=g.rosters[team][pi];return P&&r?{team,pi,P,r,eff:effOf(P)}:null};
  if(g.potg){const o=mk(g.potg.team,g.potg.pi);if(o){o.manual=true;return o}}
  const cmp=(a,b)=>[b.eff-a.eff,b.P.pts-a.P.pts,(b.P.oreb+b.P.dreb)-(a.P.oreb+a.P.dreb),b.P.ast-a.P.ast,(b.P.stl+b.P.blk)-(a.P.stl+a.P.blk),a.P.tov-b.P.tov].find(x=>x)||0;
  let best=null;
  for(const team of['home','away'])c.R[team].forEach((P,i)=>{
    if(!(P.pts||P.oreb||P.dreb||P.ast||P.stl||P.blk||P.fg2a||P.fg3a||P.fta||P.tov))return;
    const o=mk(team,i);if(!best||cmp(o,best)<0)best=o;
  });
  return best;
}
function teamBest(g,c,team){
  if(!g.rosters)return null;
  const cmp=(a,b)=>[b.eff-a.eff,b.P.pts-a.P.pts,(b.P.oreb+b.P.dreb)-(a.P.oreb+a.P.dreb),b.P.ast-a.P.ast,(b.P.stl+b.P.blk)-(a.P.stl+a.P.blk),a.P.tov-b.P.tov].find(x=>x)||0;
  let best=null;
  c.R[team].forEach((P,i)=>{
    if(!(P.pts||P.oreb||P.dreb||P.ast||P.stl||P.blk||P.fg2a||P.fg3a||P.fta||P.tov))return;
    const o={team,pi:i,P,r:g.rosters[team][i],eff:effOf(P)};if(!best||cmp(o,best)<0)best=o;
  });
  return best;
}
function teamBestHTML(g,c,team){
  const p=teamBest(g,c,team);
  return`<div class="potg-mini">⭐ <b>Possible Player of the Game — ${esc(gTeam(g,team).abbr)}:</b> ${p?`#${esc(p.r.number)} ${esc(p.r.name)}<br>${statLine(p.P)} · EFF <b>${p.eff}</b>`:'<span style="color:var(--mut)">no stats yet</span>'}</div>`;
}

async function resizeLogo(file){
  if(!file||!file.size)throw new Error('The file is empty');
  let src,w,h,done=()=>{};
  try{const bmp=await createImageBitmap(file);src=bmp;w=bmp.width;h=bmp.height;done=()=>{try{bmp.close()}catch{}}}
  catch{
    const url=URL.createObjectURL(file);
    try{const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Could not read this image — try PNG or JPG'));i.src=url});src=im;w=im.naturalWidth;h=im.naturalHeight}
    finally{URL.revokeObjectURL(url)}
  }
  try{
    const m=256,k=Math.min(1,m/Math.max(w,h)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
    const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(src,0,0,c.width,c.height);
    let out=c.toDataURL('image/png');if(out.length>300000)out=c.toDataURL('image/webp',0.85);
    return out;
  }finally{done()}
}

  return S.players.filter(p=>(!f.season||p.seasonId===f.season)&&divMatch(f,p.divisionId)&&(!f.team||p.teamId===f.team)&&(!q||p.name.toLowerCase().includes(q)||String(p.number)===q))
    .sort((a,b)=>(by('teams',a.teamId)?.name||'').localeCompare(by('teams',b.teamId)?.name||'')||numCmp(a.number,b.number));
}
function playerAgg(){
  const m={},keys=['fg2a','fg3a','fta','oreb','dreb','ast','stl','blk','tov','pf','fd'];
  for(const g of S.games){
    if(g.status!=='Final'||!g.rosters)continue;
    const c=compute(g);
    for(const side of['home','away'])g.rosters[side].forEach((r,i)=>{
      if(!r.pid)return;const P=c.R[side][i];
      if(P.min<1&&!keys.some(k=>P[k]))return;
      const a=m[r.pid]||(m[r.pid]={gp:0,pts:0,reb:0,ast:0,stl:0,blk:0,eff:0});
      a.gp++;a.pts+=P.pts;a.reb+=P.oreb+P.dreb;a.ast+=P.ast;a.stl+=P.stl;a.blk+=P.blk;a.eff+=effOf(P);
    });
  }
  return m;
}
const PCOLS=[['num','#'],['name','Player'],['team','Team'],['div','Division'],['season','Season'],['gp','GP'],['pts','PTS'],['ppg','PPG'],['reb','REB'],['ast','AST'],['stl','STL'],['blk','BLK'],['eff','EFF/G']];

  const st=p=>{const a=agg[p.id]||zero;return{...a,ppg:a.gp?a.pts/a.gp:0,eff:a.gp?a.eff/a.gp:0}};
  const tn=p=>by('teams',p.teamId)?.name||'';
  const val={num:p=>+p.number||0,name:p=>p.name.toLowerCase(),team:tn,div:p=>dName(p.divisionId),season:p=>sName(p.seasonId)};

    <td style="white-space:nowrap"><button class="btn sm" data-act="playerForm" data-id="${p.id}">Edit</button> <button class="btn sm danger" data-act="delPlayer" data-id="${p.id}">Remove</button></td></tr>`}).join('');

}

function standingsData(f){
  const fin=S.games.filter(g=>g.status==='Final');
  const divs=S.divisions.filter(d=>(!f.season||d.seasonId===f.season)&&divMatch(f,d.id)).sort((a,b)=>sName(a.seasonId).localeCompare(sName(b.seasonId),undefined,{numeric:true})||parseInt(a.name)-parseInt(b.name)||a.name.localeCompare(b.name));
  return divs.map(d=>{
    const m={},mk=(id,fallback)=>m[id]||(m[id]={t:by('teams',id)||fallback,gp:0,w:0,l:0,t2:0,pf:0,pa:0,res:[]});
    teamsIn(d.seasonId,d.id).forEach(t=>mk(t.id));
    fin.filter(g=>g.divisionId===d.id).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))||a.no-b.no).forEach(g=>{
      for(const side of['home','away']){
        const r=mk(g[side+'Id'],{name:gTeam(g,side).name,abbr:gTeam(g,side).abbr,logo:''});
        const mine=side==='home'?g.homeScore:g.awayScore,theirs=side==='home'?g.awayScore:g.homeScore;
        r.gp++;r.pf+=mine;r.pa+=theirs;
        if(mine>theirs){r.w++;r.res.push('W')}else if(mine<theirs){r.l++;r.res.push('L')}else{r.t2++;r.res.push('T')}
      }
    });
    const rows=Object.values(m).map(r=>({...r,pct:r.gp?(r.w+r.t2/2)/r.gp:0,diff:r.pf-r.pa}))
      .sort((a,b)=>b.pct-a.pct||b.diff-a.diff||b.pf-a.pf||a.t.name.localeCompare(b.t.name));
    return{d,rows};
  });
}

/* ---------- 9. Cloud Sync & Backup / Restore ---------- */
function syncLabel(){
  const c=DB.cloud;
  if(!c.on)return'☁ Offline / local';
  if(c.state==='syncing')return'☁ Syncing…';
  if(c.state==='err')return'☁ Sync error ⚠';
  if(c.state==='paused')return'☁ Sync paused';
  return c.pending?`☁ ${c.pending} waiting…`:`☁ Synced${c.last?' '+c.last:''}`;
}
function setSyncUi(){
  const c=DB.cloud,b=$('#syncbtn');
  if(b){
    b.textContent=syncLabel();
    b.classList.toggle('ok',c.on&&c.state==='ok'&&!c.pending);
    b.classList.toggle('err',c.state==='err');
    b.title=c.on?`League Space: ${c.workspace} · ${c.msg||'Click to sync now'}`:'Offline mode — changes are stored locally and will sync when connected.';
  }
  const t=$('#cloudtxt');if(t)t.innerHTML=cloudText();
}
function cloudText(){
  const c=DB.cloud;
  if(!c.on)return'<b>Offline / local mode.</b> Your data is saved in this browser and will automatically upload once cloud connection is available.';
  return`<b>${esc(syncLabel())}</b> · League Space: <code>${esc(c.workspace)}</code>${c.state==='err'?'<br><span style="color:var(--bad)">'+esc(c.msg)+'</span><br>Changes remain saved on this device and will retry automatically.':''}`;
}
A.syncNow=()=>{
  if(!DB.cloud.on)return toast('Cloud connection is currently offline — data is saved locally','info');
  DB.sync().then(()=>toast(DB.cloud.state==='ok'?'Cloud synced ✓':'Sync did not finish',DB.cloud.state==='ok'?'ok':'bad'));
};
A.changeWorkspace=async()=>{
  const cur=DB.cloud.workspace||'main-league';
  const val=await askText(
    'League Sync Space name (use the same space name on all your devices to share the exact same seasons, rosters, and game history):',
    cur,

  );

  await DB.setWorkspace(val.trim());

  render();
};
async function viewBackup(){
  let est='';try{const e=await navigator.storage.estimate();est=`Using about ${(e.usage/1048576).toFixed(1)} MB of browser storage.`}catch{}
  const lb=+LS.getItem('cs_backup');
  const c=DB.cloud;
  return`<h1>Cloud Sync & Backup</h1>
  <div class="card">
    <h2>☁ Cross-Device Cloud Sync</h2>
    <p id="cloudtxt">${cloudText()}</p>
    <p style="color:var(--mut)">Every change is saved locally first and automatically synced to Firebase Cloud Storage so you can open your league history, rosters, and box scores on any phone, tablet, or computer. Active live games are protected from remote overwrites while you are scoring them.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <button class="btn pri" data-act="syncNow">⟳ Sync now</button>
      <button class="btn" data-act="changeWorkspace">🔗 Change League Space (${esc(c.workspace)})</button>

  </div>

  <p style="color:var(--mut)">Downloading a JSON backup gives you an offline archive file you can keep or transfer anytime.</p></div>
  <div class="card"><h2>Download backup file</h2><p>Last backup: ${lb?new Date(lb).toLocaleString():'never'}</p><button class="btn pri" data-act="doBackup">⬇ Download full backup (.json)</button></div>
  <div class="card"><h2>Restore from backup</h2><p style="color:var(--bad)">Restoring replaces ALL current data (and updates the cloud copy) with the contents of the backup file.</p><input type="file" accept=".json,application/json" data-restore></div>`;

A.forcePushCloud=async()=>{
  if(!DB.cloud.on)return toast('Cloud is offline','bad');
  if(!await ask(`Upload all data currently on this device to League Space "${DB.cloud.workspace}"?\nThis will overwrite older cloud records with what you see here.`))return;
  await DB.pushAll();
  toast('Uploaded to cloud ✓','ok');
  render();
};
A.doBackup=async()=>{
  const d={app:'MYSL_Statistics',version:1,exported:new Date().toISOString(),data:S};
  if(await download(`mysl-backup-${todayStr()}.json`,JSON.stringify(d),'application/json')){
    LS.setItem('cs_backup',Date.now());
    toast('Backup saved','ok');
    if($('#view')&&location.hash.startsWith('#/backup'))render();
  }
};
async function restore(file){
  try{
    const d=JSON.parse(await file.text());
    if(!['MYSL_Statistics','COURTSIDE 2.0'].includes(d.app)||!d.data)throw new Error('Not a MYSL_Statistics backup file');
    for(const s of DB.STORES){
      if(d.data[s]===undefined)d.data[s]=[];
      else if(!Array.isArray(d.data[s]))throw new Error('Backup is corrupt: '+s);
    }
    if(!await ask(`Restore backup from ${d.exported||'unknown date'}?\n\n${d.data.seasons.length} seasons, ${d.data.teams.length} teams, ${d.data.players.length} players, ${d.data.games.length} games.\n\nThis REPLACES all current data and syncs to the cloud.`))return;
    for(const s of DB.STORES){await DB.clear(s);await DB.bulk(s,d.data[s])}
    await loadAll();
    await DB.pushAll();
    toast('Backup restored & synced','ok');
    location.hash='#/dashboard';
    render();
  }catch(err){await say('Restore failed: '+err.message)}
}

/* ---------- 9b. Mercy rule helpers ---------- */
function mercyBar(g,c){
  const th=mercyTh(g);if(th<=0)return'';
  const lead=c.score.home-c.score.away,al=Math.abs(lead);
  if(al>=th)return`<div class="mercy">🚨 MERCY RULE — ${esc(gTeam(g,lead>0?'home':'away').name)} lead by ${al} (rule: ${th}+ points). Write the details in the team notes below.</div>`;
  const m=c.flow.mercy;if(m.home||m.away)return`<div class="mercy soft">The mercy-rule margin (${th}+) was reached earlier in this game — see team notes.</div>`;
  return'';
}
function teamNotes(g,c,side){
  const flag=mercyTh(g)>0&&c.flow.mercy[side];
  return`<div class="card" style="margin-top:8px;padding:10px;${flag?'border-color:#dc2626;background:#fff5f5':''}"><div class="sect" style="margin:0 0 4px"><span>📝 Team notes — ${esc(gTeam(g,side).abbr)}${flag?' · <b style="color:var(--bad)">MERCY RULE REACHED</b>':''}</span></div><textarea data-tnotes="${side}" rows="3" style="width:100%" placeholder="Mercy rule / team notes…">${esc((g.mercyNotes||{})[side]||'')}</textarea></div>`;
}
function mercyHTML(g,c){
  const th=mercyTh(g),n=g.mercyNotes||{};
  if(th<=0&&!n.home&&!n.away)return'';
  const line=s=>{const m=c.flow.mercy[s],t=gTeam(g,s);return`<tr><td><b>${esc(t.name)}</b></td><td>${m?`<b style="color:var(--bad)">Reached +${m.lead}</b> in ${periodLabel(m.p)} (${mmss(m.clk)} left)`:'Not reached'}</td><td style="text-align:left;white-space:pre-wrap">${n[s]?esc(n[s]):'<span style="color:var(--mut)">—</span>'}</td></tr>`};
  return`<div class="tw" style="margin-top:12px"><table class="qt mercytbl"><tr><th>Mercy rule (${th}+ pt lead)</th><th>Status</th><th>Team notes</th></tr>${line('away')}${line('home')}</table></div>`;
}

function gHay(g){

function gsRun(){
  const box=$('#gsres'),q=$('#gsearch').value.trim().toLowerCase();

document.addEventListener('focusin',e=>{if(e.target.id==='gsearch'&&e.target.value)gsRun()});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(t.id==='gsearch'){if(e.key==='Escape'){t.value='';gsRun();t.blur()}else if(e.key==='Enter'){const f=$('#gsres .gsr');if(f)f.click()}return}

});

/* ---------- 9d. Season awards: Mythical 5, MVP, averages ---------- */
function fullAgg(){
  const m={},keys=['fg2a','fg3a','fta','oreb','dreb','ast','stl','blk','tov','pf','fd'];
  for(const g of S.games){
    if(g.status!=='Final'||!g.rosters)continue;
    const c=compute(g);
    for(const side of['home','away'])g.rosters[side].forEach((r,i)=>{
      if(!r.pid)return;const P=c.R[side][i];if(P.min<1&&!keys.some(k=>P[k]))return;
      const a=m[r.pid]||(m[r.pid]={gp:0,min:0,pts:0,fgm:0,fga:0,tpm:0,tpa:0,ftm:0,fta:0,reb:0,ast:0,stl:0,blk:0,tov:0,pf:0,eff:0});
      a.gp++;a.min+=P.min;a.pts+=P.pts;a.fgm+=P.fg2m+P.fg3m;a.fga+=P.fg2a+P.fg3a;a.tpm+=P.fg3m;a.tpa+=P.fg3a;a.ftm+=P.ftm;a.fta+=P.fta;
      a.reb+=P.oreb+P.dreb;a.ast+=P.ast;a.stl+=P.stl;a.blk+=P.blk;a.tov+=P.tov;a.pf+=P.pf;a.eff+=effOf(P);
    });
  }
  return m;
}
function awardsData(f){
  const agg=fullAgg();
  return standingsData(f).map(({d,rows:trows})=>{
    const tm={};trows.forEach(r=>tm[r.t.id]=r);
    const games=S.games.filter(g=>g.divisionId===d.id),remaining=games.filter(g=>g.status!=='Final').length,finals=games.length-remaining;
    const rows=S.players.filter(p=>p.divisionId===d.id).map(p=>{
      const a=agg[p.id];if(!a||!a.gp)return null;
      const tr=tm[p.teamId],tgp=tr?tr.gp:a.gp,qual=a.gp>=Math.max(1,Math.ceil(tgp*0.5)),w=tr&&tr.gp?tr.pct:0.5,n=a.gp,eff=a.eff/n;
      return{p,t:by('teams',p.teamId),a,qual,mpg:a.min/n/60,ppg:a.pts/n,rpg:a.reb/n,apg:a.ast/n,spg:a.stl/n,bpg:a.blk/n,tpg:a.tov/n,
        fgp:a.fga?a.fgm/a.fga:null,tpp:a.tpa?a.tpm/a.tpa:null,ftp:a.fta?a.ftm/a.fta:null,eff,rating:eff*(0.8+0.4*w)};
    }).filter(Boolean).sort((x,y)=>y.rating-x.rating);
    const q=rows.filter(r=>r.qual);
    return{d,rows,mvp:q[0]||null,five:q.slice(0,5),remaining,finals};
  });
}
const AW_COLS=[['num','#'],['name','Player'],['team','Team'],['gp','GP'],['mpg','MPG'],['ppg','PPG'],['rpg','RPG'],['apg','APG'],['spg','SPG'],['bpg','BPG'],['tpg','TOPG'],['fgp','FG%'],['tpp','3P%'],['ftp','FT%'],['eff','EFF'],['rating','RTG']];
const awVal={num:r=>+r.p.number||0,name:r=>r.p.name.toLowerCase(),team:r=>r.t?r.t.name.toLowerCase():'',gp:r=>r.a.gp,mpg:r=>r.mpg,ppg:r=>r.ppg,rpg:r=>r.rpg,apg:r=>r.apg,spg:r=>r.spg,bpg:r=>r.bpg,tpg:r=>r.tpg,fgp:r=>r.fgp==null?-1:r.fgp,tpp:r=>r.tpp==null?-1:r.tpp,ftp:r=>r.ftp==null?-1:r.ftp,eff:r=>r.eff,rating:r=>r.rating};
const f1=v=>v.toFixed(1),pc=v=>v==null?'—':Math.round(v*100)+'%';
function viewAwards(){
  const f=FS.awards;if(f.season===null)f.season=CUR;const so=f.sort||(f.sort={k:'rating',dir:-1});
  const data=awardsData(f);
  const card=(r,tag,mvp)=>`<div class="aw ${mvp?'mvp':''}"><div class="awtag">${tag}</div><div class="awn">${logoImg(r.t&&r.t.logo)} #${esc(r.p.number)} ${esc(r.p.name)}</div><div class="awt">${esc(r.t?r.t.name:'')}</div><div class="awl">${f1(r.ppg)} PPG · ${f1(r.rpg)} RPG · ${f1(r.apg)} APG<br>${f1(r.spg)} SPG · ${f1(r.bpg)} BPG · ${r.a.gp} GP</div><div class="awm">EFF ${f1(r.eff)} · Rating ${f1(r.rating)}</div></div>`;
  const blocks=data.map(({d,rows,mvp,five,remaining,finals})=>{
    const sorted=[...rows].sort((a,b)=>{const x=awVal[so.k](a),y=awVal[so.k](b),r=typeof x==='string'?x.localeCompare(y):x-y;return r*so.dir||b.rating-a.rating});
    const m5=new Set(five.map(r=>r.p.id)),status=!finals?'<span class="badge b-Scheduled">No final games yet</span>':remaining?`<span class="badge b-Live">Provisional — ${remaining} game(s) not final yet</span>`:'<span class="badge b-Final">Season complete — final awards</span>';
    const head=AW_COLS.map(([k,l])=>`<th class="sort ${['name','team'].includes(k)?'':'n'}" data-act="sortAwards" data-k="${k}">${l}${so.k===k?(so.dir>0?' ▲':' ▼'):''}</th>`).join('');
    const body=sorted.map(r=>`<tr class="${r.qual?'':'unq'}"><td><b>${esc(r.p.number)}</b></td><td>${mvp&&mvp.p.id===r.p.id?'🏆 ':m5.has(r.p.id)?'⭐ ':''}${esc(r.p.name)}</td><td>${esc(r.t?r.t.name:'?')}</td><td class="n">${r.a.gp}</td><td class="n">${f1(r.mpg)}</td><td class="n"><b>${f1(r.ppg)}</b></td><td class="n">${f1(r.rpg)}</td><td class="n">${f1(r.apg)}</td><td class="n">${f1(r.spg)}</td><td class="n">${f1(r.bpg)}</td><td class="n">${f1(r.tpg)}</td><td class="n">${pc(r.fgp)}</td><td class="n">${pc(r.tpp)}</td><td class="n">${pc(r.ftp)}</td><td class="n">${f1(r.eff)}</td><td class="n"><b>${f1(r.rating)}</b></td></tr>`).join('');
    return`<div class="card"><h2>${logoImg(d.logo)} ${esc(d.name)} <span style="color:var(--mut);font-weight:400;font-size:13px">· ${esc(sName(d.seasonId))}</span> &nbsp;${status}</h2>
     ${mvp?`<div class="awgrid">${card(mvp,'🏆 SEASON MVP',1)}</div><div class="sect"><span>⭐ Mythical 5</span></div><div class="awgrid">${five.map((r,i)=>card(r,'⭐ MYTHICAL 5 · #'+(i+1))).join('')}</div>`:'<div class="empty">Awards appear once games are Final and players have stats.</div>'}
     <div class="sect"><span>Season averages per game (greyed = below the games-played minimum)</span></div><div class="tw"><table><tr>${head}</tr>${body||'<tr><td colspan="16" class="empty">No stats yet.</td></tr>'}</table></div></div>`;
  }).join('');
  return`<h1>Season Awards <span class="sp"></span><button class="btn" data-act="exportAwards">⬇ CSV</button></h1>
  ${filterBar('awards',{noTeam:true,noSearch:true})}
  <p style="color:var(--mut);margin-top:-4px">Calculated automatically from Final games and updated every time a game is finalized or corrected. <b>Rating = average EFF per game × (0.8 + 0.4 × team win %)</b>, where EFF = (PTS + REB + AST + STL + BLK) − missed FG − missed FT − turnovers. Players must have played at least half of their team's games. Season MVP = top rating; Mythical 5 = top five ratings. Awards are computed per division; guest players added during a game are not included.</p>
  ${blocks||'<div class="empty">No divisions found.</div>'}`;
}
A.sortAwards=el=>{const s=FS.awards.sort||(FS.awards.sort={k:'rating',dir:-1}),k=el.dataset.k;if(s.k===k)s.dir*=-1;else{s.k=k;s.dir=['name','team','num'].includes(k)?1:-1}render()};
A.exportAwards=()=>{
  const rows=[['Season','Division','Award','#','Player','Team','GP','MPG','PPG','RPG','APG','SPG','BPG','TOPG','FG%','3P%','FT%','EFF','Rating']];
  awardsData(FS.awards).forEach(({d,rows:rs,mvp,five})=>{const m5=new Set(five.map(r=>r.p.id));
    rs.forEach(r=>rows.push([sName(d.seasonId),d.name,mvp&&mvp.p.id===r.p.id?'Season MVP + Mythical 5':m5.has(r.p.id)?'Mythical 5':'',r.p.number,r.p.name,r.t?r.t.name:'',r.a.gp,f1(r.mpg),f1(r.ppg),f1(r.rpg),f1(r.apg),f1(r.spg),f1(r.bpg),f1(r.tpg),pc(r.fgp),pc(r.tpp),pc(r.ftp),f1(r.eff),f1(r.rating)]))});
  download('mysl_season_awards.csv',toCSV(rows),'text/csv');
};

/* ---------- 9e. Streaming: OBS WebSocket + pop-out overlay ---------- */
const OBS_KEYS=['AWAY_NAME','AWAY_ABBR','AWAY_SCORE','HOME_NAME','HOME_ABBR','HOME_SCORE','CLOCK','PERIOD','AWAY_FOULS','HOME_FOULS','AWAY_TO','HOME_TO','SCOREBOARD'];
const OBS_DESC={AWAY_NAME:'Away team name',AWAY_ABBR:'Away abbreviation',AWAY_SCORE:'Away score',HOME_NAME:'Home team name',HOME_ABBR:'Home abbreviation',HOME_SCORE:'Home score',CLOCK:'Game clock',PERIOD:'Period (Q1…OT1)',AWAY_FOULS:'Away team fouls (this period)',HOME_FOULS:'Home team fouls (this period)',AWAY_TO:'Away timeouts used',HOME_TO:'Home timeouts used',SCOREBOARD:'One-line text, e.g. “EAG 45 - 52 TIG  Q3 04:21”'};
const OBS={ws:null,state:'off',msg:'',pending:{},sent:{},missing:{},rid:0,lastJS:'',cfg:Object.assign({host:'localhost',port:'4455',pw:'',prefix:'MYSL_',auto:true,autoconnect:false,custom:false,map:{}},(()=>{try{return JSON.parse(LS.getItem('mysl_obs')||'{}')}catch{return{}}})())};
const BC=typeof BroadcastChannel!=='undefined'?new BroadcastChannel('mysl_live'):null;
const OV={gid:null,last:{}};
function obsSaveCfg(){try{LS.setItem('mysl_obs',JSON.stringify(OBS.cfg))}catch{}}
const obsLabel=()=>OBS.state==='on'?'● OBS connected':OBS.state==='connecting'?'● OBS connecting…':'○ OBS off';
function setObsUi(){
  $$('[data-obsstat]').forEach(e=>{if(e.tagName==='SPAN')e.className='badge '+(OBS.state==='on'?'b-Final':OBS.state==='connecting'?'b-Live':'b-Scheduled');e.textContent=obsLabel()});
  const m=$('#obsmsg');if(m)m.textContent=OBS.msg;
  if(location.hash.startsWith('#/obs'))render();
}
async function sha256b64(str){const b=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str)));let t='';b.forEach(x=>t+=String.fromCharCode(x));return btoa(t)}
function obsDisconnect(){if(OBS.ws){OBS.ws.onclose=null;try{OBS.ws.close()}catch{}}OBS.ws=null;OBS.state='off'}
function obsConnect(){
  obsDisconnect();OBS.state='connecting';OBS.msg='';setObsUi();
  let ws;const hs=(OBS.cfg.host||'localhost').replace(/^\[|\]$/g,''),hh=hs.includes(':')?`[${hs}]`:hs;
  try{ws=new WebSocket(`ws://${hh}:${OBS.cfg.port||'4455'}`)}catch(err){OBS.state='off';OBS.msg='Invalid address: '+err.message;return setObsUi()}
  OBS.ws=ws;let opened=false;
  ws.onmessage=async ev=>{
    let m;try{m=JSON.parse(ev.data)}catch{return}
    if(m.op===0){
      opened=true;const d={rpcVersion:1,eventSubscriptions:0};
      if(m.d.authentication){
        if(!OBS.cfg.pw){OBS.msg='OBS needs a password — enter it above and connect again.';obsDisconnect();return setObsUi()}
        try{const secret=await sha256b64(OBS.cfg.pw+m.d.authentication.salt);d.authentication=await sha256b64(secret+m.d.authentication.challenge)}catch{OBS.msg='Could not compute the OBS login (open this app over https or localhost).';obsDisconnect();return setObsUi()}
      }
      ws.send(JSON.stringify({op:1,d}));
    }else if(m.op===2){OBS.state='on';OBS.sent={};OBS.missing={};OBS.msg='';toast('Connected to OBS','ok');setObsUi();if(LIVE.g)obsPush(true)}
    else if(m.op===7){
      const p=OBS.pending[m.d.requestId];if(!p)return;delete OBS.pending[m.d.requestId];
      const st=m.d.requestStatus;st.result?p.res(m.d.responseData||{}):p.rej(Object.assign(new Error(st.comment||'OBS request failed'),{code:st.code}));
    }
  };
  ws.onerror=()=>{};
  ws.onclose=ev=>{
    OBS.state='off';OBS.ws=null;
    OBS.msg=ev.code===4009?'Wrong OBS password.':opened?'Disconnected from OBS.':`Could not reach OBS at ws://${OBS.cfg.host}:${OBS.cfg.port}. Is OBS open with the WebSocket server enabled (Tools → WebSocket Server Settings)?`;
    setObsUi();
  };
}
function obsReq(type,data){
  return new Promise((res,rej)=>{
    if(OBS.state!=='on')return rej(new Error('Not connected to OBS'));
    const id='r'+(++OBS.rid);OBS.pending[id]={res,rej};
    OBS.ws.send(JSON.stringify({op:6,d:{requestType:type,requestId:id,requestData:data||{}}}));
    setTimeout(()=>{if(OBS.pending[id]){delete OBS.pending[id];rej(new Error('OBS did not answer'))}},6000);
  });
}
function payloadFor(g,c,full){
  const h=gTeam(g,'home'),a=gTeam(g,'away'),pp=Math.min(g.period,5),tf=s=>String(c.tf[s][pp]||0),per=periodLabel(g.period),clk=clockStr(g.clock);
  const p={gid:g.id,HOME_NAME:h.name,HOME_ABBR:h.abbr,HOME_SCORE:String(c.score.home),AWAY_NAME:a.name,AWAY_ABBR:a.abbr,AWAY_SCORE:String(c.score.away),CLOCK:clk,PERIOD:per,
    HOME_FOULS:tf('home'),AWAY_FOULS:tf('away'),HOME_TO:String(c.to.home),AWAY_TO:String(c.to.away),SCOREBOARD:`${a.abbr} ${c.score.away} - ${c.score.home} ${h.abbr}  ${per} ${clk}`,running:!!LIVE.running};

function obsName(k){const m=(OBS.cfg.map&&OBS.cfg.map[k])||'';return m||(OBS.cfg.custom?'':OBS.cfg.prefix+k)}
function obsSend(p,force){
  for(const k of OBS_KEYS){
    const v=p[k],nm=obsName(k);if(v==null||!nm||OBS.missing[k])continue;if(!force&&OBS.sent[k]===v)continue;OBS.sent[k]=v;

      if(err.code===600){OBS.missing[k]=1;OBS.msg=`OBS source “${nm}” was not found. Check the name on the Stream / OBS page (use “Load my OBS sources” to pick it from a list).`;setObsUi()}
    });
  }
}
function obsPush(force){
  const g=LIVE.g;if(!g)return;const c=LIVE.c||compute(g),p=payloadFor(g,c,false),js=JSON.stringify(p);
  sheetsSync(g,c,force);
  if(!force&&js===OBS.lastJS)return;OBS.lastJS=js;
  try{BC&&BC.postMessage(force?payloadFor(g,c,true):p)}catch{}

}

const LU={team:null,desired:new Set(),cur:new Set(),armed:null,c:null,buf:'',timer:null};
function lastStarters(g,team){
  const tid=g[team+'Id'];
  const prev=S.games.filter(x=>x.id!==g.id&&x.rosters&&x.seasonId===g.seasonId&&(x.homeId===tid||x.awayId===tid)&&(x.date<g.date||(x.date===g.date&&(x.no||0)<(g.no||0))))
    .sort((a,b)=>(b.date+(b.time||'')).localeCompare(a.date+(a.time||''))||(b.no||0)-(a.no||0));
  for(const x of prev){
    const side=x.homeId===tid?'home':'away';
    const onSet=new Set();x.events.filter(e=>e.team===side&&e.type==='sub'&&e.t<=2).forEach(e=>e.in?onSet.add(e.pi):onSet.delete(e.pi));
    const pids=new Set([...onSet].map(i=>(x.rosters[side][i]||{}).pid).filter(Boolean));
    const idx=[];g.rosters[team].forEach((r,i)=>{if(r.pid&&pids.has(r.pid))idx.push(i)});
    if(idx.length)return idx.slice(0,5);
  }

}
function lineupBanner(g,c){

function luDraw(){

function luTap(pi){

document.addEventListener('keydown',e=>{

/* ---------- 9g. Quick entry: type jersey number + stat code ---------- */
const QE_MAP={'1':['ft',1],'2':['fg2',1],'3':['fg3',1],'m1':['ft',0],'m2':['fg2',0],'m3':['fg3',0],'o':['oreb'],'d':['dreb'],'a':['ast'],'s':['stl'],'b':['blk'],'t':['tov'],'f':['pf'],'w':['fd'],'in':['sub',1],'out':['sub',0]};
function qeHTML(){
  return`<div class="card" style="padding:10px;margin-bottom:8px"><div class="sect" style="margin:0 0 4px"><span>⌨ Quick entry — type player #</span><span>default: <b id="qeteam" style="color:var(--orange)">${LIVE.qteam==='home'?'HOME':'AWAY'}</b> <small>(Tab)</small></span></div>
   <input id="qe" autocomplete="off" spellcheck="false" placeholder="${statFirstOn()?'3 23    ·    m2 v7    ·    d a h5':'23 3    ·    v7 m2    ·    h5 d a'}" style="width:100%;font-size:16px;font-weight:700">
   <div id="qeprev" style="min-height:18px;font-size:12px;margin-top:4px"></div>
   <label style="display:flex;gap:6px;align-items:center;font-size:12px;font-weight:700;margin:2px 0 4px"><input type="checkbox" data-statfirst ${statFirstOn()?'checked':''}> Stat first, then player # <span style="font-weight:400;color:var(--mut)">(untick = pick player first)</span></label>
   <details><summary style="font-size:11px;color:var(--mut);cursor:pointer">Codes &amp; examples</summary><div style="font-size:12px;line-height:1.7;margin-top:4px"><b>h</b> / <b>v</b> = home / visitor (optional — otherwise the default team) · <b>2 3 1</b> = made 2PT / 3PT / FT · <b>m2 m3 m1</b> = missed · <b>o</b> off reb · <b>d</b> def reb · <b>a</b> assist · <b>s</b> steal · <b>b</b> block · <b>t</b> turnover · <b>f</b> foul · <b>w</b> foul drawn · <b>in</b> / <b>out</b> sub<br>${statFirstOn()?'<b>Stat first:</b> the stat codes come first and the player number last. Examples: <code>3 h23</code> (home #23 makes a 3) · <code>m2 o v7</code> (away #7 misses a 2 and gets the offensive rebound) · <code>d a 5</code> · several players: <code>3 h23, d v7</code>':'<b>Player first:</b> number first, then the stat codes. Examples: <code>h23 3</code> (home #23 makes a 3) · <code>v7 m2 o</code> · <code>5 d a</code> · several players: <code>h23 3, v7 d</code>'}</div></details></div>`;
}
function qeParse(str){
  const g=LIVE.g,cmds=[],errs=[];
  for(const part of str.split(/[;,]+/).map(x=>x.trim()).filter(Boolean)){
    const tk=part.toLowerCase().split(/\s+/),sfm=statFirstOn(),ptok=sfm?tk[tk.length-1]:tk[0],stoks=sfm?tk.slice(0,-1):tk.slice(1),m=ptok.match(/^([hv])?#?(\d{1,3})$/);
    if(!m){errs.push(sfm?`“${part}”: end with the player number, e.g. 3 23`:`“${part}”: start with a jersey number, e.g. h23 3`);continue}
    const team=m[1]?(m[1]==='h'?'home':'away'):LIVE.qteam,pi=g.rosters[team].findIndex(x=>String(x.number)===m[2]||+x.number===+m[2]);
    if(pi<0){errs.push(`No #${m[2]} on ${team==='home'?'HOME':'AWAY'} (${gTeam(g,team).abbr})${m[1]?'':' — put h or v before the number for the other team'}`);continue}
    if(!stoks.length){errs.push(sfm?`“${part}”: add a stat code before the number, e.g. 3 ${m[2]}`:`“${part}”: add a stat code after the number, e.g. ${m[2]} 3`);continue}
    const acts=[];let bad=null;
    for(let t of stoks){t=t.replace(/^\+/,'').replace(/^[-x](?=[123]$)/,'m');const a=QE_MAP[t];if(!a){bad=t;break}acts.push(a)}
    if(bad){errs.push(`“${bad}” is not a stat code (open “Codes & examples”)`);continue}
    cmds.push({team,pi,acts});
  }
  return{cmds,errs};
}
const qeLabel=a=>a[0]==='sub'?(a[1]?'IN':'OUT'):['fg2','fg3','ft'].includes(a[0])?`${EVLBL[a[0]]} ${a[1]?'made':'missed'}`:EVLBL[a[0]];
function qePreview(){
  const q=$('#qe'),pv=$('#qeprev');if(!q||!pv||!LIVE.g)return;const v=q.value.trim();if(!v){pv.innerHTML='';return}
  const{cmds,errs}=qeParse(v);
  pv.innerHTML=errs.length?`<span style="color:var(--bad)">${esc(errs[0])}</span>`:cmds.map(c=>`<b>${esc(gTeam(LIVE.g,c.team).abbr)} #${esc(LIVE.g.rosters[c.team][c.pi].number)}</b> ${esc(LIVE.g.rosters[c.team][c.pi].name)}: ${esc(c.acts.map(qeLabel).join(' + '))}`).join(' · ');
}
function qeRun(){
  const q=$('#qe'),g=LIVE.g,v=q.value.trim();if(!v)return;
  const{cmds,errs}=qeParse(v);if(errs.length)return toast(errs[0],'bad');
  LIVE.qhist.push(v);LIVE.qhi=LIVE.qhist.length;q.value='';$('#qeprev').innerHTML='';
  for(const c of cmds){
    LIVE.qteam=c.team;
    for(const a of c.acts){
      LIVE.sel={team:c.team,pi:c.pi};
      if(a[0]!=='sub'){record(a[0],a[1]===1);continue}
      const cc=compute(g).R[c.team],on=cc[c.pi].on;
      if(a[1]&&on){toast('Already on court','bad');continue}

      if(a[1]&&cc.filter(p=>p.on).length>=5){toast('Court is full — use the Lineup window (U)','bad');continue}
      g.events.push({id:uid('e'),p:g.period,t:+nowT(g).toFixed(1),clk:+g.clock.toFixed(1),team:c.team,pi:c.pi,type:'sub',in:!!a[1],made:false});LIVE.redo=[];persist();drawLive();
    }
  }
}
document.addEventListener('keydown',e=>{

function gsScript(){
  return`// MYSL_Statistics -> Google Sheets score link
var KEY = '${GS.cfg.key}';   // must match the Secret key in the app

function doGet(e) {

async function gsSend(home,away){
  const c=GS.cfg;
  if(!/^https:\/\/script\.google\.com\/.+\/exec/.test(c.url))throw new Error('The Web app URL should start with https://script.google.com/ and end with /exec');

A.editPlayer=el=>{
  const g=LIVE.g;if(!g||!g.rosters)return;
  const team=el.dataset.team,pi=+el.dataset.pi,r=g.rosters[team][pi];if(!r)return;
  const saved=r.pid?by('players',r.pid):null;
  modal('Edit player',
    `<div class="row2">${fld('Name',`<input name="name" required value="${esc(r.name)}">`)}${fld('Jersey #',`<input name="number" required pattern="\\d{1,3}" maxlength="3" value="${esc(r.number)}">`)}</div>
     ${saved?`<label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" name="alsoSaved" checked> Also update the saved player on the team roster</label>`:'<div style="color:var(--mut);font-size:12px">This player was added during the game, so only this game is changed.</div>'}`,
    async fd=>{
      const name=fd.get('name').trim(),number=fd.get('number').trim();
      if(!name){toast('Enter a name','bad');return false}
      if(g.rosters[team].some((x,i)=>i!==pi&&String(x.number)===number)){toast(`#${number} is already used by another player in this game`,'bad');return false}
      let note='';
      if(saved&&fd.get('alsoSaved')){
        if(jerseyTaken(saved.teamId,saved.seasonId,saved.divisionId,number,saved.id))note=` (saved roster not changed: #${number} is taken there)`;
        else{saved.name=name;saved.number=number;await save('players',saved)}
      }
      r.name=name;r.number=number;persist();drawLive();toast('Player updated'+note,note?'info':'ok');
    });
};

const SP={team:null,pi:null,mode:null,timer:null};
function spCands(){
  const g=LIVE.g,R=compute(g).R[SP.team];
  return g.rosters[SP.team].map((r,i)=>({r,i,P:R[i]})).filter(x=>x.i!==SP.pi&&(SP.mode==='out'?(!x.P.on&&x.P.pf<5):x.P.on));
}
function openSubPrompt(team,pi,mode){
  const g=LIVE.g,r=g.rosters[team][pi];SP.team=team;SP.pi=pi;SP.mode=mode;
  const list=spCands();
  modal('🔄 Substitution',
   `<div style="font-size:15px">Sub ${mode==='out'?'<b style="color:var(--bad)">OUT</b>':'<b style="color:var(--ok)">IN</b>'} <b>#${esc(r.number)} ${esc(r.name)}</b> (${esc(gTeam(g,team).abbr)})</div>
    <label class="fld">${mode==='out'?'Incoming player — type jersey #':'Player coming OUT — type jersey #'}<input id="spin" name="num" inputmode="numeric" autocomplete="off" maxlength="3" style="font-size:28px;font-weight:800;text-align:center" required></label>
    <div id="spmsg" style="min-height:20px;font-size:13px"></div>
    <div style="font-size:12px;color:var(--mut)">${mode==='out'?'Available on bench':'On court'}: ${list.map(x=>'#'+esc(x.r.number)).join(', ')||'—'}</div>
    ${mode==='out'?'<button type="button" class="btn" data-act="spNone">Just send to bench (no substitute)</button>':''}`,
   ()=>spRun(),{ok:'✔ Substitute'});
}
function spPick(v){
  const list=spCands(),m=list.filter(x=>String(x.r.number).startsWith(v)),exact=list.find(x=>String(x.r.number)===v);
  return{list,m,exact,target:exact||(m.length===1?m[0]:null)};
}
function spAuto(){
  const q=$('#spin'),msg=$('#spmsg');if(!q||!msg)return;clearTimeout(SP.timer);
  const v=q.value.trim();if(!v){msg.innerHTML='';return}
  const{m,exact,target}=spPick(v);
  if(!m.length){msg.innerHTML=`<span style="color:var(--bad)">No ${SP.mode==='out'?'available bench':'on-court'} player starting with #${esc(v)}</span>`;return}
  msg.innerHTML=target?`→ <b>#${esc(target.r.number)} ${esc(target.r.name)}</b>`:`${m.length} players match — keep typing: ${m.map(x=>'#'+esc(x.r.number)).join(', ')}`;
  if(m.length===1)return q.form.requestSubmit();
  if(exact)SP.timer=setTimeout(()=>{const f=$('#spin');if(f&&f.value.trim()===v)f.form.requestSubmit()},900);
}
function spRun(){
  const g=LIVE.g,v=($('#spin').value||'').trim();if(!v){toast('Type a jersey number','bad');return false}
  const{target}=spPick(v);
  if(!target){toast(`No ${SP.mode==='out'?'available bench':'on-court'} player #${v}`,'bad');return false}
  const team=SP.team,out=SP.mode==='out'?SP.pi:target.i,inn=SP.mode==='out'?target.i:SP.pi,t=+nowT(g).toFixed(1),clk=+g.clock.toFixed(1),p=g.period;
  g.events.push({id:uid('e'),p,t,clk,team,pi:out,type:'sub',in:false,made:false});
  g.events.push({id:uid('e'),p,t,clk,team,pi:inn,type:'sub',in:true,made:false});
  LIVE.sel={team,pi:inn};LIVE.redo=[];persist();drawLive();
  toast(`${gTeam(g,team).abbr}: #${g.rosters[team][out].number} OUT · #${g.rosters[team][inn].number} IN`,'ok');
  return true;
}
A.spNone=()=>{
  const g=LIVE.g;g.events.push({id:uid('e'),p:g.period,t:+nowT(g).toFixed(1),clk:+g.clock.toFixed(1),team:SP.team,pi:SP.pi,type:'sub',in:false,made:false});

function sfCheck(force){
  const sf=LIVE.sf,g=LIVE.g;if(!sf)return;clearTimeout(sf.timer);sfDraw();if(!sf.buf)return;
  const c=g.rosters[sf.team].map((x,i)=>({x,i})).filter(o=>String(o.x.number).startsWith(sf.buf)),ex=c.find(o=>String(o.x.number)===sf.buf);
  if(!c.length){toast(`No #${sf.buf} on ${gTeam(g,sf.team).abbr} — press H / V to switch team`,'bad');sf.buf='';sfDraw();return}
  if(c.length===1)return sfFire(sf.team,c[0].i);
  if(ex&&force)return sfFire(sf.team,ex.i);
  if(ex)sf.timer=setTimeout(()=>{if(LIVE.sf===sf&&sf.buf===ex.x.number)sfFire(sf.team,ex.i)},900);

function sfKey(e,eat){
  const k=e.code,sf=LIVE.sf;
  if(/^(Digit|Numpad)\d$/.test(k)&&!e.shiftKey){eat();sf.buf+=k.slice(-1);sfCheck(false);return true}
  if(k==='Backspace'){eat();sf.buf=sf.buf.slice(0,-1);sfCheck(false);return true}
  if(k==='Enter'){eat();sfCheck(true);return true}
  if(k==='Escape'){eat();clearTimeout(sf.timer);LIVE.sf=null;sfDraw();return true}
  if((k==='KeyH'||k==='KeyV')&&!e.shiftKey){eat();sf.team=k==='KeyH'?'home':'away';sfCheck(false);sfDraw();return true}
  return false;
}

const SH_MAIN=[['fg2a','2PA','a2'],['fg3a','3PA','a3'],['fta','FTA','af'],['oreb','OR','oreb'],['dreb','DR','dreb'],['ast','A','ast'],['stl','S','stl'],['blk','B','blk'],['tov','TO','tov']];

function shCard(g,c,side){

  const inr=`<tr class="inr"><td class="rs">${c.score[side]}</td><td><select data-np="${side}" title="Points for the next basket">${[1,2,3].map(v=>`<option value="${v}" ${npOf(side)===v?'selected':''}>${v}</option>`).join('')}</select></td><td>${inp('pts')}</td>${cols.map(([k])=>`<td>${inp(k)}</td>`).join('')}<td colspan="${nq}">${inp('foul','Foul '+periodLabel(g.period))}</td></tr>`;
  const qp=[];for(let q=1;q<=Math.min(nq,5);q++){const f=c.tf[side][q]||0;qp.push(`<span class="qc ${f>=5?'bon':''}">${q<5?periodLabel(q):'OT'} · ${f}</span>`)}

</div>`;
}
function shBody(g,c){
  return`<div class="ghint noprint"><b>Stat sheet:</b> for a basket pick the points in <b>NP</b> (1 / 2 / 3) and type the <b>jersey number</b> in <b>#P</b>. <b>Attempts:</b> type the number in <b>2PA / 3PA / FTA</b> for <u>every</u> shot, the ones that go in too (a make with no attempt typed still counts as one). Then <b>OR, DR, A, S, B, TO</b>, and <b>foul #</b> for a foul in the current quarter (orange columns = fouls per quarter). It saves as soon as the number matches one player (or press Enter). Several at once: <b>7 12 7</b> + Enter. <b>Tab / ← →</b> next box · <b>↑ ↓</b> other team · click a number to remove it · newest entries are at the top.

function rowPick(team,tok){const r=LIVE.g.rosters[team];let i=r.findIndex(x=>String(x.number)===tok);if(i<0)i=r.findIndex(x=>+x.number===+tok);return i}
function rowCommit(inp,dest){
  const g=LIVE.g;if(!g)return false;clearTimeout(LIVE.rtm);
  const team=inp.dataset.team,spec=shSpec(team,inp.dataset.k),toks=inp.value.split(/[\s,]+/).filter(Boolean);
  if(!toks.length)return false;
  const idx=[];
  for(const t of toks){
    if(!/^\d{1,3}$/.test(t)){toast('Jersey numbers only (for example 7)','bad');return false}
    const i=rowPick(team,t);if(i<0){toast(`No #${t} on ${gTeam(g,team).abbr}`,'bad');return false}
    idx.push(i);
  }
  const before=compute(g),type=spec.type,made=spec.made;
  if(g.status==='Scheduled')g.status='Live';
  idx.forEach(pi=>g.events.push({id:uid('e'),p:g.period,t:+nowT(g).toFixed(1),clk:+g.clock.toFixed(1),team,pi,type,made}));
  LIVE.redo=[];
  const after=compute(g),m0=before.flow.mercy,m1=after.flow.mercy,nh=m1.home&&!m0.home,na=m1.away&&!m0.away;
  if(nh||na)setTimeout(()=>toast('🚨 MERCY RULE — '+gTeam(g,nh?'home':'away').name+' lead by '+mercyTh(g)+'+','bad'),60);
  if(type==='pf')[...new Set(idx)].forEach(pi=>{if(after.R[team][pi].pf>=5)toast(`#${g.rosters[team][pi].number} ${g.rosters[team][pi].name} has 5 fouls — FOULED OUT`,'bad')});
  toast(`${spec.lb} — ${idx.map(i=>'#'+g.rosters[team][i].number).join(', ')}`,'ok');
  const d=dest||inp;LIVE.gfocus={team:d.dataset.team,k:d.dataset.k};
  persist();drawLive();return true;
}
function rowAuto(inp){
  clearTimeout(LIVE.rtm);const v=inp.value.trim();if(!v||/[\s,]/.test(v)||!LIVE.g)return;
  const r=LIVE.g.rosters[inp.dataset.team],m=r.filter(x=>String(x.number).startsWith(v)),ex=r.some(x=>String(x.number)===v||(/^\d+$/.test(v)&&+x.number===+v&&String(x.number).length===v.length));
  if(ex&&m.length<=1)return rowCommit(inp);
  if(ex)LIVE.rtm=setTimeout(()=>{if(inp.isConnected&&inp.value.trim()===v)rowCommit(inp)},800);
}
document.addEventListener('input',e=>{const t=e.target;if(t.classList&&t.classList.contains('ji')){const v=t.value.replace(/[^\d\s,]/g,'');if(v!==t.value)t.value=v;rowAuto(t)}});
document.addEventListener('keydown',e=>{
  const t=e.target;if(!t.classList||!t.classList.contains('ji')||!LIVE.g)return;
  const key=e.key,team=t.dataset.team,all=$$('.ji'),mine=all.filter(x=>x.dataset.team===team),i=mine.indexOf(t),empty=!t.value.trim();let to=null;
  if(key==='Escape'){e.preventDefault();clearTimeout(LIVE.rtm);t.value='';t.blur();return}
  if(key==='Enter'){e.preventDefault();rowCommit(t);return}
  if((key==='Tab'&&!e.shiftKey)||(key==='ArrowRight'&&empty))to=mine[i+1]||all.find(x=>x.dataset.team!==team);
  else if((key==='Tab'&&e.shiftKey)||(key==='ArrowLeft'&&empty))to=mine[i-1]||null;
  else if(key==='ArrowUp'||key==='ArrowDown'){const o=team==='home'?'away':'home';to=all.find(x=>x.dataset.team===o&&x.dataset.k===t.dataset.k)}
  else return;
  if(!to&&key==='Tab'&&e.shiftKey)return;
  e.preventDefault();if(!to)return;
  if(!empty){if(!rowCommit(t,to))return}else to.focus();
});
